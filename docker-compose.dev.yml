services:
  # Backend API service (development mode)
  api-dev:
    build:
      context: ./socialmapper-api
      dockerfile: Dockerfile.dev
    container_name: socialmapper-api-dev
    ports:
      - "8000:8000"
    environment:
      - SOCIALMAPPER_API_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - SOCIALMAPPER_API_CENSUS_API_KEY=${CENSUS_API_KEY}
      - SOCIALMAPPER_API_RATE_LIMIT_PER_MINUTE=120
      - SOCIALMAPPER_API_API_AUTH_ENABLED=false
      - SOCIALMAPPER_API_RESULT_STORAGE_PATH=/app/results
    volumes:
      - ./socialmapper-api:/app
      - api-results-dev:/app/results
    networks:
      - socialmapper-network-dev
    command: uvicorn api_server.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend UI service (development mode with Vite)
  ui-dev:
    image: node:20-alpine
    container_name: socialmapper-ui-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_TITLE=SocialMapper (Dev)
      - VITE_APP_VERSION=1.0.0-dev
      - VITE_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
      - VITE_ENABLE_DEVTOOLS=true
      - NODE_ENV=development
    volumes:
      - ./socialmapper-ui:/app
      - ui-node-modules-dev:/app/node_modules
    networks:
      - socialmapper-network-dev
    command: sh -c "npm install --no-audit --no-fund && npm run typecheck && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - api-dev

networks:
  socialmapper-network-dev:
    driver: bridge

volumes:
  api-results-dev:
  ui-node-modules-dev: