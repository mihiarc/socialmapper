# Prometheus configuration for SocialMapper performance monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "performance_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # SocialMapper API monitoring
  - job_name: 'socialmapper-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 10s
    scheme: http

  # SocialMapper UI monitoring (if metrics endpoint available)
  - job_name: 'socialmapper-ui'
    static_configs:
      - targets: ['ui:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # PostgreSQL monitoring (if used)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # Nginx/Load Balancer monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s

  # k6 test results (webhook endpoint)
  - job_name: 'k6-results'
    static_configs:
      - targets: ['k6-webhook:9090']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # Lighthouse CI results (webhook endpoint)  
  - job_name: 'lighthouse-results'
    static_configs:
      - targets: ['lighthouse-webhook:9091']
    metrics_path: '/metrics'
    scrape_interval: 300s # Every 5 minutes

  # Blackbox exporter for external monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://demo.socialmapper.com
        - https://api.socialmapper.com/api/v1/health
        - https://staging.socialmapper.com
        - https://staging-api.socialmapper.com/api/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Custom performance metrics from our webhook receivers
  - job_name: 'performance-metrics'
    static_configs:
      - targets: ['performance-collector:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s