# Prometheus Configuration for SocialMapper Monitoring
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
---
# Prometheus RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'socialmapper-prod'
        environment: 'production'

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        scrape_interval: 15s
        metrics_path: /metrics

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name

      # SocialMapper API - Enhanced with more detailed metrics
      - job_name: 'socialmapper-api'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - socialmapper
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: socialmapper-api-service
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
        - source_labels: [__address__]
          target_label: __address__
          regex: (.+)
          replacement: $1
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: app
        - source_labels: [__meta_kubernetes_pod_label_version]
          target_label: version
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /metrics
        
      # SocialMapper API Business Metrics
      - job_name: 'socialmapper-api-business'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - socialmapper
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: socialmapper-api-service
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
        - source_labels: [__address__]
          target_label: __address__
          regex: (.+)
          replacement: $1
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        scrape_interval: 30s
        metrics_path: /api/v1/metrics/business

      # Redis - Enhanced metrics collection
      - job_name: 'redis'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - socialmapper
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: redis-service
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: metrics
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: instance
        scrape_interval: 30s
        
      # Redis Exporter for detailed Redis metrics
      - job_name: 'redis-exporter'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - socialmapper
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: redis-exporter-service
        scrape_interval: 30s

      # Node Exporter
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - monitoring
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: node-exporter

      # Kube-state-metrics for Kubernetes object metrics
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - monitoring
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: kube-state-metrics
        scrape_interval: 30s
        
      # cAdvisor for container metrics
      - job_name: 'cadvisor'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/\${1}/proxy/metrics/cadvisor
        scrape_interval: 30s
        
      # AWS Load Balancer metrics (CloudWatch exporter)
      - job_name: 'aws-load-balancer'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - monitoring
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: cloudwatch-exporter
        scrape_interval: 60s

  alerts.yml: |
    groups:
    - name: socialmapper-alerts
      rules:
      # High CPU usage - Node level
      - alert: HighNodeCPUUsage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High node CPU usage detected on {{ $labels.instance }}"
          description: "Node CPU usage is above 80% for more than 5 minutes. Current usage: {{ $value }}%"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-cpu-usage"
          
      # High CPU usage - Pod level
      - alert: HighPodCPUUsage
        expr: (rate(container_cpu_usage_seconds_total{container!="POD",namespace="socialmapper"}[5m]) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High pod CPU usage detected"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has high CPU usage: {{ $value }}%"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-pod-cpu"

      # High memory usage - Node level
      - alert: HighNodeMemoryUsage
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High node memory usage detected on {{ $labels.instance }}"
          description: "Node memory usage is above 85% for more than 5 minutes. Current usage: {{ $value }}%"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-memory-usage"
          
      # High memory usage - Pod level
      - alert: HighPodMemoryUsage
        expr: (container_memory_usage_bytes{container!="POD",namespace="socialmapper"} / container_spec_memory_limit_bytes{container!="POD",namespace="socialmapper"} * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High pod memory usage detected"
          description: "Pod {{ $labels.pod }} memory usage is above 85% of limit: {{ $value }}%"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-pod-memory"

      # API response time - P95
      - alert: HighAPIResponseTimeP95
        expr: histogram_quantile(0.95, rate(fastapi_request_duration_seconds_bucket{job="socialmapper-api"}[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API P95 response time: {{ $labels.method }} {{ $labels.path }}"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.method }} {{ $labels.path }}"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-api-latency"
          
      # API response time - P99 Critical
      - alert: CriticalAPIResponseTimeP99
        expr: histogram_quantile(0.99, rate(fastapi_request_duration_seconds_bucket{job="socialmapper-api"}[5m])) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical API P99 response time: {{ $labels.method }} {{ $labels.path }}"
          description: "99th percentile response time is {{ $value }}s for {{ $labels.method }} {{ $labels.path }}"
          runbook_url: "https://docs.socialmapper.com/runbooks/critical-api-latency"

      # API error rate - 5xx errors
      - alert: HighAPI5xxErrorRate
        expr: |
          (
            rate(fastapi_requests_total{job="socialmapper-api",status=~"5.."}[5m])
            /
            rate(fastapi_requests_total{job="socialmapper-api"}[5m])
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API 5xx error rate: {{ $labels.method }} {{ $labels.path }}"
          description: "API 5xx error rate is {{ $value }}% for {{ $labels.method }} {{ $labels.path }}"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-error-rate"
          
      # API error rate - 4xx errors (client errors)
      - alert: HighAPI4xxErrorRate
        expr: |
          (
            rate(fastapi_requests_total{job="socialmapper-api",status=~"4.."}[5m])
            /
            rate(fastapi_requests_total{job="socialmapper-api"}[5m])
          ) * 100 > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API 4xx error rate: {{ $labels.method }} {{ $labels.path }}"
          description: "API 4xx error rate is {{ $value }}% for {{ $labels.method }} {{ $labels.path }}"
          runbook_url: "https://docs.socialmapper.com/runbooks/high-client-errors"

      # Redis connectivity
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance is not responding"

      # Pod restart rate
      - alert: HighPodRestartRate
        expr: rate(kube_pod_container_status_restarts_total{namespace="socialmapper"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High pod restart rate"
          description: "Pods are restarting frequently in socialmapper namespace"

      # Disk space
      - alert: LowDiskSpace
        expr: node_filesystem_free_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"} < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10%"

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.48.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=15d'
          - '--web.enable-lifecycle'
          - '--web.enable-admin-api'
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-storage
          mountPath: /prometheus/
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-storage

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: web
  selector:
    app: prometheus

---
# Prometheus Storage PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 50Gi