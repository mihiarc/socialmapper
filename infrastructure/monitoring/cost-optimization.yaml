# Cost Optimization Configuration for SocialMapper Monitoring Stack
# This file contains resource optimization, storage efficiency, and cost management configurations

apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-cost-optimization
  namespace: monitoring
data:
  # Resource optimization strategies
  resource-optimization.yaml: |
    # Multi-tier resource allocation strategy
    environments:
      development:
        resource_multiplier: 0.3
        storage_multiplier: 0.5
        retention_days: 3
        scrape_interval: 30s
        
      staging:
        resource_multiplier: 0.6
        storage_multiplier: 0.7
        retention_days: 7
        scrape_interval: 15s
        
      production:
        resource_multiplier: 1.0
        storage_multiplier: 1.0
        retention_days: 15
        scrape_interval: 15s
    
    # Component-specific optimizations
    components:
      prometheus:
        # Use time-based storage tiering
        storage_tiers:
          hot: "2d"      # Recent data in fast storage
          warm: "7d"     # Older data in medium storage
          cold: "15d"    # Oldest data in cheap storage
          
        # Query optimization
        query_optimizations:
          max_concurrent_queries: 20
          query_timeout: 30s
          lookback_delta: 5m
          
        # Resource scaling rules
        horizontal_scaling:
          min_replicas: 1
          max_replicas: 3
          target_cpu_utilization: 70
          target_memory_utilization: 80
        
      grafana:
        # Dashboard optimization
        dashboard_optimizations:
          max_data_points: 1000
          refresh_intervals: ["5s", "10s", "30s", "1m", "5m"]
          default_refresh: "30s"
          
        # Cache settings
        cache_settings:
          enable_datasource_cache: true
          cache_ttl: 300 # 5 minutes
          
      alertmanager:
        # Alert optimization
        alert_optimizations:
          group_wait: 10s
          group_interval: 5m
          repeat_interval: 12h
          max_alerts_per_group: 50
          
  # Storage optimization configuration
  storage-optimization.yaml: |
    # Prometheus storage optimization
    prometheus:
      # Compression settings
      compression:
        chunk_encoding: "XOR"
        sample_compression_ratio: 3.2
        
      # Retention policies by metric type
      retention_policies:
        high_frequency_metrics: "2d"    # CPU, memory metrics
        medium_frequency_metrics: "7d"  # Request metrics
        low_frequency_metrics: "15d"    # Business metrics
        
      # Block storage optimization
      block_storage:
        min_block_duration: "2h"
        max_block_duration: "24h"
        retention_size_based: true
        max_bytes_per_series: "1GB"
        
      # Metric filtering for cost optimization
      metric_filtering:
        # Drop high cardinality metrics in non-production
        drop_high_cardinality:
          - "container_network_receive_bytes_total{pod!~'.*important.*'}"
          - "container_network_transmit_bytes_total{pod!~'.*important.*'}"
        
        # Reduce recording rule frequency
        recording_rules:
          evaluation_interval: "30s"
          
    # Log aggregation optimization
    logging:
      # Log level optimization by environment
      log_levels:
        development: "debug"
        staging: "info"
        production: "warn"
        
      # Log retention by service
      retention_by_service:
        api: "7d"
        ui: "3d"
        monitoring: "14d"
        
  # Auto-scaling configuration
  auto-scaling.yaml: |
    # Horizontal Pod Autoscaler configurations
    hpa_configs:
      prometheus:
        min_replicas: 1
        max_replicas: 5
        target_cpu_utilization: 70
        target_memory_utilization: 85
        scale_up_stabilization: 60s
        scale_down_stabilization: 300s
        
      grafana:
        min_replicas: 1
        max_replicas: 3
        target_cpu_utilization: 80
        target_memory_utilization: 85
        
      alertmanager:
        min_replicas: 1
        max_replicas: 2
        target_cpu_utilization: 75
        
    # Vertical Pod Autoscaler configurations
    vpa_configs:
      enabled: false  # Enable for development/testing
      update_mode: "Off"  # "Off", "Initial", "Recreation", "Auto"
      
  # Resource quotas and limits
  resource-limits.yaml: |
    # Namespace resource quotas
    resource_quotas:
      monitoring:
        hard:
          requests.cpu: "4"
          requests.memory: "8Gi"
          limits.cpu: "12"
          limits.memory: "24Gi"
          persistentvolumeclaims: "10"
          
    # Limit ranges for cost control
    limit_ranges:
      container_limits:
        type: "Container"
        default:
          cpu: "100m"
          memory: "128Mi"
        default_request:
          cpu: "10m"
          memory: "32Mi"
        max:
          cpu: "4"
          memory: "8Gi"
          
      pvc_limits:
        type: "PersistentVolumeClaim"
        max:
          storage: "100Gi"

---
# Horizontal Pod Autoscaler for Prometheus
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prometheus-hpa
  namespace: monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prometheus
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# Horizontal Pod Autoscaler for Grafana
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grafana-hpa
  namespace: monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grafana
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 180

---
# Resource Quota for monitoring namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    # CPU and Memory quotas
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "12"
    limits.memory: "24Gi"
    
    # Storage quotas
    persistentvolumeclaims: "10"
    requests.storage: "200Gi"
    
    # Object count quotas
    pods: "50"
    services: "20"
    configmaps: "30"
    secrets: "20"

---
# Limit Range for cost control
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
  - type: Container
    default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "10m"
      memory: "32Mi"
      
  - type: PersistentVolumeClaim
    max:
      storage: "100Gi"
    min:
      storage: "1Gi"

---
# Network Policy for cost-effective traffic management
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-network-policy
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: socialmapper
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 9090  # Prometheus
    - protocol: TCP
      port: 3000  # Grafana
    - protocol: TCP
      port: 9093  # AlertManager
    - protocol: TCP
      port: 8080  # kube-state-metrics
    - protocol: TCP
      port: 9100  # node-exporter
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS
    - protocol: TCP
      port: 80   # HTTP
    - protocol: UDP
      port: 53   # DNS

---
# CronJob for automated cost optimization
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-optimization-cleanup
  namespace: monitoring
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: alpine/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Running cost optimization cleanup..."
              
              # Clean up old Prometheus data beyond retention period
              echo "Cleaning up old Prometheus data..."
              curl -X POST http://prometheus:9090/api/v1/admin/tsdb/delete_series?match[]={__name__=~".+"}
              curl -X POST http://prometheus:9090/api/v1/admin/tsdb/clean_tombstones
              
              # Clean up unused Grafana dashboard snapshots
              echo "Cleaning up Grafana resources..."
              # Add Grafana cleanup logic here
              
              echo "Cost optimization cleanup completed"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
          restartPolicy: OnFailure
      backoffLimit: 3