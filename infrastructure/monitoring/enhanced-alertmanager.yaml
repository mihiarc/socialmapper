# Enhanced Alertmanager Configuration with Smart Escalation for SocialMapper
apiVersion: v1
kind: ConfigMap
metadata:
  name: enhanced-alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@socialmapper.com'
      smtp_auth_username: 'alerts@socialmapper.com'
      smtp_auth_password: 'smtp_password'
      smtp_require_tls: true
      
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
      # Critical alerts - immediate escalation
      - match:
          severity: critical
        receiver: critical-alerts
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 15m
        continue: true
        routes:
        - match:
            alertname: 'HighAPI5xxErrorRate'
          receiver: api-critical-alerts
          group_wait: 5s
          repeat_interval: 5m
        - match:
            alertname: 'RedisDown'
          receiver: infrastructure-critical-alerts
          group_wait: 5s
          repeat_interval: 10m
        - match:
            alertname: 'CriticalAPIResponseTimeP99'
          receiver: api-critical-alerts
          group_wait: 5s
          repeat_interval: 5m
      
      # Warning alerts - escalation after persistence
      - match:
          severity: warning
        receiver: warning-alerts
        group_wait: 2m
        group_interval: 10m
        repeat_interval: 2h
        routes:
        - match_re:
            alertname: '^(HighNode.*|LowDiskSpace)$'
          receiver: infrastructure-warning-alerts
          group_wait: 5m
          repeat_interval: 1h
        - match_re:
            alertname: '^(LowAnalysisSuccessRate|HighAnalysisQueueDepth)$'
          receiver: business-alerts
          group_wait: 10m
          repeat_interval: 4h
      
      # Business hours vs off-hours routing
      - match:
          severity: warning
        receiver: warning-alerts-business-hours
        active_time_intervals:
        - business-hours
        group_wait: 5m
        repeat_interval: 1h
      
      - match:
          severity: warning
        receiver: warning-alerts-off-hours
        active_time_intervals:
        - off-hours
        group_wait: 30m
        repeat_interval: 4h

    time_intervals:
    - name: business-hours
      time_intervals:
      - times:
        - start_time: '09:00'
          end_time: '17:00'
        weekdays: ['monday:friday']
        location: 'America/New_York'
    
    - name: off-hours
      time_intervals:
      - times:
        - start_time: '17:01'
          end_time: '08:59'
        weekdays: ['monday:friday']
        location: 'America/New_York'
      - times:
        - start_time: '00:00'
          end_time: '23:59'
        weekdays: ['saturday', 'sunday']
        location: 'America/New_York'

    receivers:
    - name: 'default-receiver'
      webhook_configs:
      - url: 'http://127.0.0.1:5001/'
        send_resolved: true

    # Critical alerts - immediate notification with escalation
    - name: 'critical-alerts'
      email_configs:
      - to: 'ops-team@socialmapper.com'
        subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }} - SocialMapper'
        body: |
          {{ template "email.default" . }}
        headers:
          Priority: 'urgent'
          X-Priority: '1'
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#alerts-critical'
        title: '🚨 CRITICAL Alert - SocialMapper'
        text: |
          {{ template "slack.socialmapper.text" . }}
        send_resolved: true
        actions:
        - type: button
          text: 'Runbook'
          url: '{{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}'
        - type: button
          text: 'Silence'
          url: '{{ .ExternalURL }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22{{ if ne .Name "alertname" }}%2C{{ end }}{{ end }}%7D'
      
      pagerduty_configs:
      - service_key: '{{ .ExternalURL }}/pagerduty-service-key'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          environment: 'production'
    
    # API-specific critical alerts with faster escalation
    - name: 'api-critical-alerts'
      email_configs:
      - to: 'api-team@socialmapper.com,ops-team@socialmapper.com'
        subject: '🚨 API CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          {{ template "email.api.critical" . }}
        headers:
          Priority: 'urgent'
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#api-alerts'
        title: '🚨 API CRITICAL - Immediate Action Required'
        text: |
          {{ template "slack.api.critical" . }}
        send_resolved: true
      
      webhook_configs:
      - url: 'https://api.pagerduty.com/integration/v1/enqueue'
        send_resolved: true
    
    # Infrastructure critical alerts
    - name: 'infrastructure-critical-alerts'
      email_configs:
      - to: 'infra-team@socialmapper.com,ops-team@socialmapper.com'
        subject: '🚨 INFRASTRUCTURE CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          {{ template "email.infra.critical" . }}
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#infrastructure-alerts'
        title: '🚨 Infrastructure Critical'
        text: |
          {{ template "slack.infra.critical" . }}
        send_resolved: true

    # Warning alerts - business hours
    - name: 'warning-alerts-business-hours'
      email_configs:
      - to: 'dev-team@socialmapper.com'
        subject: '⚠️  Warning: {{ .GroupLabels.alertname }}'
        body: |
          {{ template "email.warning.business" . }}
        headers:
          Priority: 'normal'
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#alerts-warning'
        title: '⚠️  Warning Alert - Business Hours'
        text: |
          {{ template "slack.warning.business" . }}
        send_resolved: true
    
    # Warning alerts - off hours (less aggressive)
    - name: 'warning-alerts-off-hours'
      email_configs:
      - to: 'on-call@socialmapper.com'
        subject: '⚠️  Off-Hours Warning: {{ .GroupLabels.alertname }}'
        body: |
          {{ template "email.warning.offhours" . }}
        headers:
          Priority: 'low'
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#alerts-off-hours'
        title: '⚠️  Off-Hours Warning'
        text: |
          {{ template "slack.warning.offhours" . }}
        send_resolved: true
    
    # Standard warning alerts
    - name: 'warning-alerts'
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#alerts-warning'
        title: '⚠️  Warning Alert'
        text: |
          {{ template "slack.socialmapper.text" . }}
        send_resolved: true
    
    # Infrastructure warning alerts
    - name: 'infrastructure-warning-alerts'
      email_configs:
      - to: 'infra-team@socialmapper.com'
        subject: '⚠️  Infrastructure Warning: {{ .GroupLabels.alertname }}'
        body: |
          {{ template "email.infra.warning" . }}
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#infrastructure-alerts'
        title: '⚠️  Infrastructure Warning'
        text: |
          {{ template "slack.infra.warning" . }}
        send_resolved: true
    
    # Business metrics alerts
    - name: 'business-alerts'
      email_configs:
      - to: 'product-team@socialmapper.com,dev-team@socialmapper.com'
        subject: '📊 Business Metric Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ template "email.business" . }}
      
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#business-metrics'
        title: '📊 Business Metric Alert'
        text: |
          {{ template "slack.business" . }}
        send_resolved: true

    # Intelligent alert suppression
    inhibit_rules:
    # Critical alerts suppress related warnings
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'instance', 'job']
    
    # Node down suppresses all node-specific alerts
    - source_match:
        alertname: 'NodeDown'
      target_match_re:
        alertname: '^(HighNodeCPUUsage|HighNodeMemoryUsage|LowDiskSpace).*'
      equal: ['instance']
    
    # API service down suppresses API-related alerts
    - source_match:
        alertname: 'ServiceDown'
        service: 'socialmapper-api'
      target_match_re:
        alertname: '^(HighAPI.*|LowAnalysisSuccessRate).*'
      equal: ['job']
    
    # Pod crash loop suppresses resource usage alerts for the same pod
    - source_match:
        alertname: 'PodCrashLooping'
      target_match_re:
        alertname: '^(HighPod.*Usage).*'
      equal: ['pod', 'namespace']
    
    # Database connectivity issues suppress business metric alerts
    - source_match:
        alertname: 'RedisDown'
      target_match_re:
        alertname: '^(LowAnalysisSuccessRate|HighAnalysisQueueDepth).*'
      equal: ['job']

  templates: |
    {{ define "cluster" }}{{ .ExternalURL | reReplaceAll ".*alertmanager\\.(.*)", "$1" }}{{ end }}
    
    {{ define "email.default" }}
    Alert Summary:
    {{ range .Alerts }}
    Alert: {{ .Annotations.summary }}
    Description: {{ .Annotations.description }}
    Severity: {{ .Labels.severity }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    {{ if .Annotations.runbook_url }}
    Runbook: {{ .Annotations.runbook_url }}
    {{ end }}
    
    Labels:
    {{ range .Labels.SortedPairs }}- {{ .Name }}: {{ .Value }}
    {{ end }}
    
    {{ end }}
    
    Grafana Dashboard: https://monitoring.socialmapper.com/grafana/
    Alertmanager: {{ .ExternalURL }}
    {{ end }}
    
    {{ define "email.api.critical" }}
    🚨 API CRITICAL ALERT 🚨
    
    {{ range .Alerts }}
    Service: {{ .Labels.job }}
    Endpoint: {{ .Labels.method }} {{ .Labels.path }}
    Alert: {{ .Annotations.summary }}
    Description: {{ .Annotations.description }}
    Current Value: {{ .Annotations.value }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    
    {{ if .Annotations.runbook_url }}
    Immediate Action Required - Follow Runbook: {{ .Annotations.runbook_url }}
    {{ end }}
    {{ end }}
    
    This is a critical API issue that requires immediate attention.
    {{ end }}
    
    {{ define "email.infra.critical" }}
    🚨 INFRASTRUCTURE CRITICAL ALERT 🚨
    
    {{ range .Alerts }}
    Component: {{ .Labels.instance | default .Labels.pod }}
    Alert: {{ .Annotations.summary }}
    Description: {{ .Annotations.description }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    
    {{ if .Annotations.runbook_url }}
    Runbook: {{ .Annotations.runbook_url }}
    {{ end }}
    {{ end }}
    
    Immediate infrastructure attention required.
    {{ end }}
    
    {{ define "email.warning.business" }}
    ⚠️  Warning Alert (Business Hours)
    
    {{ range .Alerts }}
    Alert: {{ .Annotations.summary }}
    Description: {{ .Annotations.description }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    {{ if .Annotations.runbook_url }}
    Runbook: {{ .Annotations.runbook_url }}
    {{ end }}
    {{ end }}
    
    Please investigate when convenient during business hours.
    {{ end }}
    
    {{ define "email.warning.offhours" }}
    ⚠️  Off-Hours Warning Alert
    
    {{ range .Alerts }}
    Alert: {{ .Annotations.summary }}
    Description: {{ .Annotations.description }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    {{ end }}
    
    This can be investigated during next business day unless it escalates.
    {{ end }}
    
    {{ define "email.business" }}
    📊 Business Metric Alert
    
    {{ range .Alerts }}
    Metric: {{ .Annotations.summary }}
    Description: {{ .Annotations.description }}
    Current Value: {{ .Annotations.value }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    {{ end }}
    
    Business impact may be occurring. Please review.
    {{ end }}
    
    {{ define "slack.socialmapper.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Annotations.summary }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}
    *Description:* {{ .Annotations.description }}
    {{ if .Annotations.value }}*Value:* `{{ .Annotations.value }}`{{ end }}
    *Started:* {{ .StartsAt.Format "15:04:05" }}
    {{ if .GeneratorURL }}*Graph:* <{{ .GeneratorURL }}|📊 View>{{ end }}
    {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|📚 Action Steps>{{ end }}
    
    *Labels:*
    {{ range .Labels.SortedPairs }}• *{{ .Name }}:* `{{ .Value }}`
    {{ end }}
    {{ end }}
    {{ end }}
    
    {{ define "slack.api.critical" }}
    🚨 *API CRITICAL - IMMEDIATE ACTION REQUIRED* 🚨
    {{ range .Alerts }}
    *Service:* `{{ .Labels.job }}`
    {{ if .Labels.path }}*Endpoint:* `{{ .Labels.method }} {{ .Labels.path }}`{{ end }}
    *Issue:* {{ .Annotations.summary }}
    *Details:* {{ .Annotations.description }}
    {{ if .Annotations.value }}*Current Value:* `{{ .Annotations.value }}`{{ end }}
    *Duration:* {{ .StartsAt.Format "15:04:05" }}
    {{ if .Annotations.runbook_url }}
    🔥 *TAKE ACTION NOW:* <{{ .Annotations.runbook_url }}|Follow Runbook>
    {{ end }}
    {{ end }}
    {{ end }}
    
    {{ define "slack.infra.critical" }}
    🚨 *INFRASTRUCTURE CRITICAL* 🚨
    {{ range .Alerts }}
    *Component:* `{{ .Labels.instance | default .Labels.pod }}`
    *Issue:* {{ .Annotations.summary }}
    *Details:* {{ .Annotations.description }}
    *Duration:* {{ .StartsAt.Format "15:04:05" }}
    {{ if .Annotations.runbook_url }}
    🔧 *Action Required:* <{{ .Annotations.runbook_url }}|Infrastructure Runbook>
    {{ end }}
    {{ end }}
    {{ end }}
    
    {{ define "slack.business" }}
    📊 *Business Metric Alert*
    {{ range .Alerts }}
    *Metric:* {{ .Annotations.summary }}
    *Impact:* {{ .Annotations.description }}
    {{ if .Annotations.value }}*Value:* `{{ .Annotations.value }}`{{ end }}
    *Since:* {{ .StartsAt.Format "15:04:05" }}
    {{ end }}
    
    Business operations may be affected. Please review.
    {{ end }}

---
# Enhanced Alertmanager Secret
apiVersion: v1
kind: Secret
metadata:
  name: enhanced-alertmanager-secret
  namespace: monitoring
type: Opaque
stringData:
  smtp_password: "your_smtp_password_here"
  slack_webhook_url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
  pagerduty_service_key: "your_pagerduty_integration_key_here"
  
  # Email templates for better formatting
  email_templates: |
    {{ define "email.subject.critical" }}🚨 CRITICAL: {{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}{{ end }}
    {{ define "email.subject.warning" }}⚠️  WARNING: {{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}{{ end }}

---
# Enhanced Alertmanager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-alertmanager
  namespace: monitoring
  labels:
    app: enhanced-alertmanager
spec:
  replicas: 2  # High availability
  selector:
    matchLabels:
      app: enhanced-alertmanager
  template:
    metadata:
      labels:
        app: enhanced-alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.26.0
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
          - '--web.external-url=https://monitoring.socialmapper.com/alertmanager/'
          - '--web.route-prefix=/'
          - '--cluster.listen-address=0.0.0.0:9094'
          - '--cluster.peer=enhanced-alertmanager:9094'
          - '--log.level=info'
        ports:
        - containerPort: 9093
          name: web
        - containerPort: 9094
          name: cluster
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager/
        - name: alertmanager-storage
          mountPath: /alertmanager/
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: alertmanager-config
        configMap:
          name: enhanced-alertmanager-config
      - name: alertmanager-storage
        persistentVolumeClaim:
          claimName: enhanced-alertmanager-storage

---
# Enhanced Alertmanager Service
apiVersion: v1
kind: Service
metadata:
  name: enhanced-alertmanager
  namespace: monitoring
  labels:
    app: enhanced-alertmanager
spec:
  type: ClusterIP
  ports:
  - port: 9093
    targetPort: 9093
    name: web
  - port: 9094
    targetPort: 9094
    name: cluster
  selector:
    app: enhanced-alertmanager

---
# Enhanced Alertmanager Storage PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enhanced-alertmanager-storage
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi