# Complete Grafana Monitoring Stack for SocialMapper
# This includes Grafana deployment, dashboards, and enhanced alerting

---
# Grafana Namespace (if not using monitoring namespace)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    monitoring: enabled

---
# Grafana ConfigMap for configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: config
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    
    [grafana_net]
    url = https://grafana.net
    
    [log]
    mode = console
    level = info
    
    [paths]
    data = /var/lib/grafana/data
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [server]
    protocol = http
    http_port = 3000
    domain = grafana.demo.socialmapper.com
    enforce_domain = false
    root_url = https://grafana.demo.socialmapper.com
    serve_from_sub_path = false
    
    [database]
    type = sqlite3
    host = 127.0.0.1:3306
    name = grafana
    user = root
    password = ""
    ssl_mode = disable
    path = grafana.db
    max_idle_conn = 2
    max_open_conn = 0
    conn_max_lifetime = 14400
    log_queries = false
    cache_mode = private
    
    [session]
    provider = file
    provider_config = sessions
    cookie_name = grafana_sess
    cookie_secure = true
    session_life_time = 86400
    
    [dataproxy]
    logging = false
    timeout = 30
    dialTimeout = 10
    keep_alive_seconds = 30
    
    [security]
    admin_user = admin
    admin_password = $__file{/etc/grafana/secrets/admin-password}
    secret_key = $__file{/etc/grafana/secrets/secret-key}
    login_remember_days = 7
    cookie_username = grafana_user
    cookie_remember_name = grafana_remember
    disable_gravatar = true
    allow_embedding = false
    cookie_samesite = lax
    cookie_secure = true
    strict_transport_security = true
    
    [snapshots]
    external_enabled = true
    external_snapshot_url = https://snapshots-origin.raintank.io
    external_snapshot_name = Publish to snapshot.raintank.io
    snapshot_remove_expired = true
    
    [dashboards]
    versions_to_keep = 20
    min_refresh_interval = 5s
    default_home_dashboard_path = /var/lib/grafana/dashboards/socialmapper-overview.json
    
    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_id = 1
    auto_assign_org_role = Viewer
    verify_email_enabled = false
    login_hint = email or username
    password_hint = password
    default_theme = dark
    
    [auth]
    login_cookie_name = grafana_session
    login_maximum_inactive_lifetime_duration = 7d
    login_maximum_lifetime_duration = 30d
    token_rotation_interval_minutes = 10
    disable_login_form = false
    disable_signout_menu = false
    signout_redirect_url = ""
    oauth_auto_login = false
    oauth_state_cookie_max_age = 600
    api_key_max_seconds_to_live = -1
    
    [auth.anonymous]
    enabled = false
    org_name = Main Org.
    org_role = Viewer
    hide_version = false
    
    [auth.basic]
    enabled = true
    
    [smtp]
    enabled = false
    host = localhost:587
    user = ""
    password = ""
    cert_file = ""
    key_file = ""
    skip_verify = false
    from_address = admin@grafana.localhost
    from_name = Grafana
    ehlo_identity = dashboard.example.com
    startTLS_policy = ""
    
    [emails]
    welcome_email_on_sign_up = false
    templates_pattern = emails/*.html
    
    [log.console]
    level = info
    format = console
    
    [quota]
    enabled = false
    org_user = 10
    org_dashboard = 100
    org_data_source = 10
    org_api_key = 10
    user_org = 10
    global_user = -1
    global_org = -1
    global_dashboard = -1
    global_api_key = -1
    global_session = -1
    
    [alerting]
    enabled = true
    execute_alerts = true
    error_or_timeout = alerting
    nodata_or_nullvalues = no_data
    concurrent_render_limit = 5
    evaluation_timeout_seconds = 30
    notification_timeout_seconds = 30
    max_attempts = 3
    min_interval_seconds = 1
    max_annotation_age = 168h
    
    [explore]
    enabled = true
    
    [metrics]
    enabled = true
    interval_seconds = 10
    disable_total_stats = false
    basic_auth_username = ""
    basic_auth_password = ""
    
    [metrics.graphite]
    address = ""
    prefix = prod.grafana.%(instance_name)s.
    
    [tracing.jaeger]
    address = localhost:6831
    always_included_tag = ""
    sampler_type = const
    sampler_param = 1
    zipkin_propagation = false
    disable_shared_zipkin_spans = false
    
    [external_image_storage]
    provider = ""
    
    [panels]
    enable_alpha = false
    disable_sanitize_html = false
    
    [plugins]
    enable_alpha = false
    app_tls_skip_verify_insecure = false
    
    [enterprise]
    license_path = ""
    
    [feature_toggles]
    enable = ""
    
    [date_formats]
    full_date = YYYY-MM-DD HH:mm:ss
    interval_second = HH:mm:ss
    interval_minute = HH:mm
    interval_hour = MM/DD HH:mm
    interval_day = MM/DD
    interval_month = YYYY-MM
    interval_year = YYYY
    use_browser_locale = false
    default_timezone = browser

---
# Grafana Secret for credentials
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: credentials
type: Opaque
data:
  admin-password: YWRtaW4xMjM0  # admin1234 base64 encoded - CHANGE IN PRODUCTION
  secret-key: SW4zNHJzZWN1cmU=  # In3cures3cur3 base64 encoded - CHANGE IN PRODUCTION

---
# Grafana Datasources ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: datasources
data:
  datasources.yaml: |
    apiVersion: 1
    
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      password: ""
      user: ""
      database: ""
      basicAuth: false
      basicAuthUser: ""
      basicAuthPassword: ""
      withCredentials: false
      isDefault: true
      jsonData:
        graphiteVersion: "1.1"
        tlsAuth: false
        tlsAuthWithCACert: false
        httpMethod: POST
        manageAlerts: true
        alertmanagerUid: alertmanager
      secureJsonData:
        tlsCACert: ""
        tlsClientCert: ""
        tlsClientKey: ""
        password: ""
        basicAuthPassword: ""
        tlsAuthWithCACert: false
      version: 1
      editable: true
      
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      password: ""
      user: ""
      database: ""
      basicAuth: false
      basicAuthUser: ""
      basicAuthPassword: ""
      withCredentials: false
      isDefault: false
      jsonData:
        maxLines: 1000
        timeout: 60
        alertmanagerUid: alertmanager
      secureJsonData:
        password: ""
        basicAuthPassword: ""
      version: 1
      editable: true

---
# Grafana Dashboard Providers ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard-providers
data:
  providers.yaml: |
    apiVersion: 1
    
    providers:
    - name: 'socialmapper-dashboards'
      orgId: 1
      folder: 'SocialMapper'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/socialmapper
        
    - name: 'kubernetes-dashboards'
      orgId: 1
      folder: 'Kubernetes'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/kubernetes
        
    - name: 'infrastructure-dashboards'
      orgId: 1
      folder: 'Infrastructure'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/infrastructure

---
# Grafana Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: true

---
# Grafana ClusterRole for reading cluster metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]

---
# Grafana ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: monitoring

---
# Grafana PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: deployment
    app.kubernetes.io/version: "10.2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: deployment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      
      initContainers:
      - name: init-chmod-data
        image: busybox:1.35
        command: ['sh', '-c', 'chmod -R 777 /var/lib/grafana']
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - FOWNER
          readOnlyRootFilesystem: true
      
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: grafana
          containerPort: 3000
          protocol: TCP
        
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-password
        - name: GF_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: secret-key
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel,natel-discrete-panel,vonage-status-panel,btplc-status-dot-panel"
        - name: GF_PATHS_DATA
          value: /var/lib/grafana
        - name: GF_PATHS_LOGS
          value: /var/log/grafana
        - name: GF_PATHS_PLUGINS
          value: /var/lib/grafana/plugins
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        
        livenessProbe:
          httpGet:
            path: /api/health
            port: grafana
          initialDelaySeconds: 60
          timeoutSeconds: 30
          failureThreshold: 10
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: grafana
          initialDelaySeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards-socialmapper
          mountPath: /var/lib/grafana/dashboards/socialmapper
        - name: grafana-dashboards-kubernetes
          mountPath: /var/lib/grafana/dashboards/kubernetes
        - name: grafana-dashboards-infrastructure
          mountPath: /var/lib/grafana/dashboards/infrastructure
        - name: grafana-secrets
          mountPath: /etc/grafana/secrets
        
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
      
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage
      
      - name: grafana-config
        configMap:
          name: grafana-config
      
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-dashboard-providers
      
      - name: grafana-dashboards-socialmapper
        configMap:
          name: grafana-dashboards-socialmapper
      
      - name: grafana-dashboards-kubernetes
        configMap:
          name: grafana-dashboards-kubernetes
      
      - name: grafana-dashboards-infrastructure
        configMap:
          name: grafana-dashboards-infrastructure
      
      - name: grafana-secrets
        secret:
          secretName: grafana-credentials
      
      nodeSelector:
        kubernetes.io/os: linux
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: ["grafana"]
              topologyKey: kubernetes.io/hostname

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: grafana
    port: 3000
    targetPort: grafana
    protocol: TCP
  selector:
    app.kubernetes.io/name: grafana

---
# Grafana Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - Grafana'
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options SAMEORIGIN;
      add_header X-Content-Type-Options nosniff;
      add_header X-XSS-Protection "1; mode=block";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;";
spec:
  tls:
  - hosts:
    - grafana.demo.socialmapper.com
    secretName: grafana-tls
  
  rules:
  - host: grafana.demo.socialmapper.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

---
# Basic auth secret for Grafana ingress (optional additional security)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-basic-auth
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: auth
type: Opaque
data:
  auth: Z3JhZmFuYTokMnkkMTAkL01GdkxYdWlZbkxQQVIuL2Z0d2hlLks4emdGWjIyTHRRTVhhaEFlWk1oaDJWMmRpOGppbWk=  # grafana:grafana123

---
# ServiceMonitor for Prometheus to scrape Grafana metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  endpoints:
  - port: grafana
    interval: 30s
    path: /metrics
    honorLabels: true

---
# NetworkPolicy for Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-netpol
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow ingress from nginx-ingress
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  
  # Allow ingress from Prometheus
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 3000
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow egress to Prometheus
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  
  # Allow egress to Loki
  - to:
    - podSelector:
        matchLabels:
          app: loki
    ports:
    - protocol: TCP
      port: 3100
  
  # Allow HTTPS for plugin downloads
  - to: []
    ports:
    - protocol: TCP
      port: 443

---
# PodDisruptionBudget for Grafana
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana-pdb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana