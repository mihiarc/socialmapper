# Kubernetes Network Policies for Security Hardening
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  # This policy denies all ingress and egress traffic by default
  # Other policies will explicitly allow required traffic

---
# Allow ingress traffic to API pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-api
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from ingress controllers
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: ingress-system
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow traffic from UI pods
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: socialmapper-ui
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow monitoring traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000

---
# Allow ingress traffic to UI pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from ingress controllers
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: ingress-system
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow monitoring traffic
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080

---
# Allow ingress traffic to Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from API pods
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: socialmapper-api
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow monitoring traffic for metrics
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9121

---
# Allow egress traffic from API pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-api
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow connection to Redis
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow HTTPS traffic to external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  
  # Allow HTTP traffic to external APIs (if needed)
  - to: []
    ports:
    - protocol: TCP
      port: 80
  
  # Allow connection to Kubernetes API server
  - to: []
    ports:
    - protocol: TCP
      port: 6443

---
# Allow egress traffic from UI pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-egress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow connection to API pods
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: socialmapper-api
    ports:
    - protocol: TCP
      port: 8000

---
# Allow egress traffic from Redis pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# Allow traffic for monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: monitoring
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow scraping metrics from all namespaces
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8000  # API metrics
    - protocol: TCP
      port: 8080  # UI metrics
    - protocol: TCP
      port: 9121  # Redis metrics
    - protocol: TCP
      port: 9100  # Node exporter
  
  # Allow connection to Kubernetes API
  - to: []
    ports:
    - protocol: TCP
      port: 6443
  
  # Allow HTTPS for external alerting
  - to: []
    ports:
    - protocol: TCP
      port: 443

---
# Network Policy for kube-system namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-system
  namespace: kube-system
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress to kube-system (required for cluster operation)
  - from: []
  egress:
  # Allow all egress from kube-system (required for cluster operation)
  - to: []