# Blue Environment UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialmapper-ui-blue
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: socialmapper
    app.kubernetes.io/version: "blue"
    deployment-type: blue-green
    environment: blue
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui
      app.kubernetes.io/version: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialmapper-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: blue
        deployment-type: blue-green
        environment: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: socialmapper-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      containers:
        - name: ui
          image: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-ui:{{ .Values.blue.imageTag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            # Blue-specific configuration
            - name: DEPLOYMENT_TYPE
              value: "blue-green"
            - name: ENVIRONMENT_COLOR
              value: "blue"
            - name: VITE_ENVIRONMENT_INDICATOR
              value: "blue"
            
            # API configuration
            - name: VITE_API_URL
              value: "https://demo.socialmapper.com/api"
            - name: VITE_API_VERSION
              value: "v1"
            
            # Application configuration
            - name: VITE_APP_TITLE
              value: "SocialMapper Demo"
            - name: VITE_APP_VERSION
              value: "{{ .Values.blue.imageTag }}"
            - name: VITE_APP_ENVIRONMENT
              value: "production-blue"
            
            # Feature flags
            - name: VITE_DEMO_MODE
              value: "true"
            - name: VITE_SHOW_ENVIRONMENT_BADGE
              value: "false"  # Don't show environment to users
          
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp-storage
              mountPath: /tmp
            - name: cache-storage
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: X-Environment
                  value: blue
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: X-Environment
                  value: blue
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0644
        - name: tmp-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: cache-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: nginx-pid
          emptyDir:
            sizeLimit: 10Mi

