  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: socialmapper-api
    app.kubernetes.io/version: green

---
apiVersion: v1
kind: Service
metadata:
  name: socialmapper-ui-green-service
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: frontend
    environment: green
    deployment-type: blue-green
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/version: green

---
# Ingress for Blue-Green Switching
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialmapper-blue-green-ingress
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-blue-green-ingress
    deployment-type: blue-green
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Blue-Green specific annotations
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Active-Environment "{{ .Values.activeEnvironment | default \"blue\" }}" always;
      add_header X-Deployment-Type "blue-green" always;
      add_header X-Switch-Timestamp "{{ .Values.switchTimestamp }}" always;
    
    # Rate limiting and security
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://demo.socialmapper.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

spec:
  tls:
    - hosts:
        - demo.socialmapper.com
        - blue.demo.socialmapper.com
        - green.demo.socialmapper.com
      secretName: socialmapper-tls
  
  rules:
    # Main production traffic (routes to active environment)
    - host: demo.socialmapper.com
      http:
        paths:
          # API routes to active environment
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: socialmapper-api-active
                port:
                  number: 8000
          
          # UI routes to active environment
          - path: /
            pathType: Prefix
            backend:
              service:
                name: socialmapper-ui-active
                port:
                  number: 8080
    
    # Direct access to blue environment (for testing)
    - host: blue.demo.socialmapper.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: socialmapper-api-blue-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: socialmapper-ui-blue-service
                port:
                  number: 8080
    
    # Direct access to green environment (for testing)
    - host: green.demo.socialmapper.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: socialmapper-api-green-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: socialmapper-ui-green-service
                port:
                  number: 8080

---
# ServiceMonitor for Blue-Green Metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: socialmapper-blue-green-metrics
  namespace: socialmapper
  labels:
    deployment-type: blue-green
spec:
  selector:
    matchLabels:
      deployment-type: blue-green
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_environment]
          targetLabel: environment
        - sourceLabels: [__meta_kubernetes_service_label_active_environment]
          targetLabel: active_environment
        - sourceLabels: [__meta_kubernetes_pod_label_deployment_type]
          targetLabel: deployment_type