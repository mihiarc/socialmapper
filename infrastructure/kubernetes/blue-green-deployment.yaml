# Blue-Green Deployment Configuration for SocialMapper
apiVersion: v1
kind: Namespace
metadata:
  name: socialmapper-blue-green
  labels:
    deployment-strategy: blue-green
    app.kubernetes.io/part-of: socialmapper

---
# Blue Environment - Current Production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialmapper-api-blue
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: socialmapper
    app.kubernetes.io/version: "blue"
    deployment-type: blue-green
    environment: blue
spec:
  replicas: 3  # Production replicas
  strategy:
    type: Recreate  # Blue-Green uses recreate strategy
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-api
      app.kubernetes.io/version: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialmapper-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: blue
        deployment-type: blue-green
        environment: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        blue-green.deployment.timestamp: "{{ .Values.blueDeploymentTimestamp }}"
        config.linkerd.io/proxy-await: "enabled"
    spec:
      serviceAccountName: socialmapper-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Checking dependencies for Blue environment..."
              until nc -z redis-service.socialmapper.svc.cluster.local 6379; do
                echo "Waiting for Redis...";
                sleep 2;
              done;
              echo "All dependencies ready for Blue environment";
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
        
        - name: blue-environment-validation
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Validating Blue environment configuration..."
              # Add validation logic for blue environment
              echo "Blue environment validation completed"
      
      containers:
        - name: api
          image: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-api:{{ .Values.blue.imageTag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          env:
            # Blue-Green specific environment variables
            - name: DEPLOYMENT_TYPE
              value: "blue-green"
            - name: ENVIRONMENT_COLOR
              value: "blue"
            - name: DEPLOYMENT_TIMESTAMP
              value: "{{ .Values.blueDeploymentTimestamp }}"
            
            # Standard configuration
            - name: SOCIALMAPPER_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_HOST
            - name: SOCIALMAPPER_API_PORT
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_PORT
            - name: SOCIALMAPPER_API_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_WORKERS
            - name: SOCIALMAPPER_API_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_LOG_LEVEL
            - name: SOCIALMAPPER_API_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_CORS_ORIGINS
            
            # Database and cache configuration
            - name: SOCIALMAPPER_API_CENSUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: socialmapper-secrets
                  key: SOCIALMAPPER_API_CENSUS_API_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: socialmapper-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service.socialmapper.svc.cluster.local:6379/0"
            
            # Pod information
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          volumeMounts:
            - name: results-storage
              mountPath: /app/results
            - name: tmp-storage
              mountPath: /tmp
            - name: cache-storage
              mountPath: /app/cache
          
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders:
                - name: X-Environment
                  value: blue
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
              httpHeaders:
                - name: X-Environment
                  value: blue
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # Blue-Green specific startup probe
          startupProbe:
            httpGet:
              path: /api/v1/health/startup
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # Allow longer startup time
            successThreshold: 1
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "echo 'Blue environment stopping' && sleep 15"]
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      
      volumes:
        - name: results-storage
          persistentVolumeClaim:
            claimName: api-results-pvc
        - name: tmp-storage
          emptyDir:
            sizeLimit: 1Gi
        - name: cache-storage
          emptyDir:
            sizeLimit: 2Gi
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["socialmapper-api"]
                  - key: app.kubernetes.io/version
                    operator: In
                    values: ["blue"]
              topologyKey: kubernetes.io/hostname
        
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: blue-green-capable
                    operator: In
                    values: ["true"]
      
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "compute-intensive"
          effect: "NoSchedule"
      
      terminationGracePeriodSeconds: 60

