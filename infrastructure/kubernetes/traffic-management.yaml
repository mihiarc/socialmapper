# Traffic Management Configuration for Advanced Deployments
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-management-config
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
    component: traffic-management
data:
  nginx.conf: |
    upstream socialmapper_api_stable {
        least_conn;
        server socialmapper-api-service.socialmapper.svc.cluster.local:8000 weight=100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream socialmapper_api_canary {
        least_conn;
        server socialmapper-api-canary-service.socialmapper.svc.cluster.local:8000 weight=100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream socialmapper_ui_stable {
        least_conn;
        server socialmapper-ui-service.socialmapper.svc.cluster.local:8080 weight=100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream socialmapper_ui_canary {
        least_conn;
        server socialmapper-ui-canary-service.socialmapper.svc.cluster.local:8080 weight=100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Canary traffic splitting logic
    map $request_id $api_backend {
        default "stable";
        ~^.{0,1}$ "canary";  # Route ~5% of traffic to canary based on request_id
    }
    
    map $request_id $ui_backend {
        default "stable";
        ~^.{0,1}$ "canary";  # Route ~5% of traffic to canary based on request_id
    }
    
    # Header-based canary routing
    map $http_x_canary_user $force_canary {
        default 0;
        "true" 1;
        "1" 1;
    }
    
    server {
        listen 80;
        server_name demo.socialmapper.com;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=ui_limit:10m rate=20r/s;
        
        # API routing with canary support
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Health check bypass (always go to stable)
            if ($uri ~* "/health") {
                proxy_pass http://socialmapper_api_stable;
                break;
            }
            
            # Force canary routing for specific users
            if ($force_canary = 1) {
                proxy_pass http://socialmapper_api_canary;
                break;
            }
            
            # Canary traffic splitting
            if ($api_backend = "canary") {
                proxy_pass http://socialmapper_api_canary;
                break;
            }
            
            # Default to stable
            proxy_pass http://socialmapper_api_stable;
            
            # Proxy configuration
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Add routing information to response headers
            add_header X-Served-By $api_backend;
            add_header X-Request-ID $request_id;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Retry configuration
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
        }
        
        # UI routing with canary support
        location / {
            # Rate limiting
            limit_req zone=ui_limit burst=50 nodelay;
            
            # Static assets always go to stable
            if ($uri ~* "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$") {
                proxy_pass http://socialmapper_ui_stable;
                expires 1y;
                add_header Cache-Control "public, immutable";
                break;
            }
            
            # Health check bypass
            if ($uri = "/health") {
                proxy_pass http://socialmapper_ui_stable;
                break;
            }
            
            # Force canary routing for specific users
            if ($force_canary = 1) {
                proxy_pass http://socialmapper_ui_canary;
                add_header X-Served-By "canary";
                break;
            }
            
            # Canary traffic splitting for HTML requests
            if ($ui_backend = "canary") {
                proxy_pass http://socialmapper_ui_canary;
                add_header X-Served-By "canary";
                break;
            }
            
            # Default to stable
            proxy_pass http://socialmapper_ui_stable;
            add_header X-Served-By "stable";
            
            # Proxy configuration
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Caching for UI
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache $http_pragma $http_authorization;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Metrics endpoint for monitoring
        location /nginx-metrics {
            stub_status on;
            access_log off;
            allow 10.0.0.0/8;
            deny all;
        }
        
        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

---
# NGINX Deployment for Traffic Management
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-traffic-manager
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: nginx-traffic-manager
    app.kubernetes.io/component: traffic-management
    app.kubernetes.io/part-of: socialmapper
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-traffic-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-traffic-manager
        app.kubernetes.io/component: traffic-management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: socialmapper-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp-storage
              mountPath: /tmp
            - name: cache-storage
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
        
        # NGINX Prometheus Exporter
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:0.11.0
          args:
            - -nginx.scrape-uri=http://localhost/nginx-metrics
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
      
      volumes:
        - name: nginx-config
          configMap:
            name: traffic-management-config
            defaultMode: 0644
        - name: tmp-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: cache-storage
          emptyDir:
            sizeLimit: 500Mi
        - name: nginx-pid
          emptyDir:
            sizeLimit: 10Mi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["nginx-traffic-manager"]
                topologyKey: kubernetes.io/hostname

---
# Traffic Management Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-traffic-manager-service
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: nginx-traffic-manager
    app.kubernetes.io/component: traffic-management
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/nginx-health"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: nginx-traffic-manager

---
# NGINX Metrics Service Monitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-traffic-manager-metrics
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: nginx-traffic-manager
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-traffic-manager
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      honorLabels: true

---
# HorizontalPodAutoscaler for Traffic Manager
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-traffic-manager-hpa
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: nginx-traffic-manager
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-traffic-manager
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-traffic-manager-pdb
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: nginx-traffic-manager
    app.kubernetes.io/component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-traffic-manager

---
# Traffic Splitting ConfigMap for Dynamic Updates
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-splitting-config
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
    component: traffic-splitting
data:
  # Canary traffic configuration
  canary.api.enabled: "false"
  canary.api.percentage: "5"
  canary.ui.enabled: "false"
  canary.ui.percentage: "2"
  
  # Blue-Green configuration
  bluegreen.active.environment: "blue"
  bluegreen.switch.enabled: "false"
  
  # Circuit breaker configuration
  circuit.breaker.enabled: "true"
  circuit.breaker.failure.threshold: "50"
  circuit.breaker.timeout: "30"
  
  # Rate limiting configuration
  rate.limit.api.rps: "10"
  rate.limit.ui.rps: "20"
  rate.limit.burst.multiplier: "2"

---
# Network Policy for Traffic Management
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traffic-management-network-policy
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
    component: traffic-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-traffic-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from load balancer
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9113  # Metrics
  egress:
    # Allow traffic to application services
    - to:
        - namespaceSelector:
            matchLabels:
              name: socialmapper
      ports:
        - protocol: TCP
          port: 8000  # API
        - protocol: TCP
          port: 8080  # UI
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
      namespaceSelector:
        matchLabels:
          name: kube-system