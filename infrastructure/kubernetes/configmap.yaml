# ConfigMap for SocialMapper Application Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: socialmapper-config
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: config
data:
  # API Server Configuration
  SOCIALMAPPER_API_HOST: "0.0.0.0"
  SOCIALMAPPER_API_PORT: "8000"
  SOCIALMAPPER_API_WORKERS: "4"
  SOCIALMAPPER_API_LOG_LEVEL: "info"
  SOCIALMAPPER_API_CORS_ORIGINS: "https://demo.socialmapper.com,https://socialmapper.com"
  SOCIALMAPPER_API_RATE_LIMIT_PER_MINUTE: "200"
  SOCIALMAPPER_API_API_AUTH_ENABLED: "false"  # Demo mode
  SOCIALMAPPER_API_RESULT_STORAGE_PATH: "/app/results"
  SOCIALMAPPER_API_MAX_CONCURRENT_JOBS: "50"  # Higher for demo load
  SOCIALMAPPER_API_RESULT_TTL_HOURS: "2"      # Short TTL for demo
  SOCIALMAPPER_API_CLEANUP_INTERVAL_MINUTES: "30"
  
  # External API Configuration
  SOCIALMAPPER_API_OSM_API_TIMEOUT: "30"
  SOCIALMAPPER_API_CENSUS_API_TIMEOUT: "30"
  
  # Analysis Configuration
  SOCIALMAPPER_API_DEFAULT_TRAVEL_TIME_MINUTES: "15"
  SOCIALMAPPER_API_MAX_TRAVEL_TIME_MINUTES: "30"  # Limited for demo
  SOCIALMAPPER_API_MAX_POI_TYPES_PER_REQUEST: "5" # Limited for demo
  SOCIALMAPPER_API_MAX_CENSUS_VARIABLES_PER_REQUEST: "10"
  
  # Resource Limits for Demo
  MAX_ANALYSIS_RADIUS_KM: "50"        # Limit analysis scope
  MAX_CONCURRENT_USERS: "500"         # Demo user limit
  SESSION_TIMEOUT_MINUTES: "30"       # Auto cleanup sessions
  
  # Redis Configuration
  REDIS_HOST: "redis-service.socialmapper.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CLUSTER_MODE: "false"
  
  # Database Configuration (for future use)
  POSTGRES_HOST: ""  # Will be populated from external RDS
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "socialmapper"
  
  # Feature Flags
  ENABLE_RATE_LIMITING: "true"
  ENABLE_MONITORING: "true"
  ENABLE_CACHING: "true"
  ENABLE_ASYNC_PROCESSING: "true"
  
  # Monitoring and Observability
  PROMETHEUS_METRICS_ENABLED: "true"
  PROMETHEUS_METRICS_PATH: "/metrics"
  JAEGER_ENABLED: "false"
  
  # Application Settings
  APP_NAME: "SocialMapper Demo"
  APP_VERSION: "1.0.0"
  APP_ENVIRONMENT: "production"
---
# ConfigMap for Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: config
data:
  redis.conf: |
    # Redis Configuration for Session Storage
    bind 0.0.0.0
    port 6379
    timeout 300
    tcp-keepalive 300
    
    # Memory Management
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    
    # Persistence (disabled for session storage)
    save ""
    
    # Security
    protected-mode yes
    
    # Logging
    loglevel notice
    logfile ""
    
    # Performance
    tcp-backlog 511
    databases 16
    
    # Session-specific settings
    # Expire sessions after 30 minutes of inactivity
    # This will be handled by application logic
---
# ConfigMap for Nginx Configuration (if using nginx sidecar)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        
        # Logging
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log  /var/log/nginx/access.log  main;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=ui:10m rate=50r/s;
        
        # API upstream
        upstream api {
            server localhost:8000;
        }
        
        # UI upstream
        upstream ui {
            server localhost:8080;
        }
        
        server {
            listen 80;
            server_name _;
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # API routes
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Timeouts
                proxy_connect_timeout 30s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                
                # Buffer settings
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
            }
            
            # UI routes
            location / {
                limit_req zone=ui burst=100 nodelay;
                proxy_pass http://ui;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Static file caching
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
            }
        }
    }