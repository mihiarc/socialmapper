# Kubernetes Namespace and RBAC Configuration
apiVersion: v1
kind: Namespace
metadata:
  name: socialmapper
  labels:
    name: socialmapper
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubernetes
---
# Network Policy for namespace isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socialmapper-netpol
  namespace: socialmapper
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from nginx-ingress namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
    # Allow inter-pod communication within namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: socialmapper
    # Allow monitoring from prometheus namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8000  # API metrics port
        - protocol: TCP
          port: 8080  # UI metrics port
  egress:
    # Allow all egress (can be restricted further based on requirements)
    - {}
---
# Resource Quota for the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: socialmapper-quota
  namespace: socialmapper
spec:
  hard:
    # Compute resources
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    
    # Storage resources
    requests.storage: 100Gi
    persistentvolumeclaims: "10"
    
    # Object counts
    pods: "20"
    services: "10"
    secrets: "10"
    configmaps: "10"
    
    # Load balancers
    services.loadbalancers: "2"
---
# Limit Range for pods in the namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: socialmapper-limits
  namespace: socialmapper
spec:
  limits:
    - default:
        cpu: "1"
        memory: "2Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      type: Container
    - max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
      type: Container
    - max:
        storage: "50Gi"
      min:
        storage: "1Gi"
      type: PersistentVolumeClaim