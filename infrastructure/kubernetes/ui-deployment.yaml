# SocialMapper UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialmapper-ui
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: socialmapper
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2  # Multiple replicas for availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialmapper-ui
        app.kubernetes.io/component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: socialmapper-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Init container to wait for API
      initContainers:
        - name: wait-for-api
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              until nc -z socialmapper-api-service.socialmapper.svc.cluster.local 8000; do
                echo "Waiting for API...";
                sleep 2;
              done;
              echo "API is ready!";
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
      
      containers:
        - name: ui
          image: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-ui:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            # API endpoint configuration
            - name: VITE_API_URL
              value: "https://demo.socialmapper.com/api"
            - name: VITE_API_VERSION
              value: "v1"
            
            # Application configuration
            - name: VITE_APP_TITLE
              value: "SocialMapper Demo"
            - name: VITE_APP_VERSION
              value: "1.0.0"
            - name: VITE_APP_ENVIRONMENT
              value: "production"
            
            # Feature flags for demo
            - name: VITE_ENABLE_ANALYTICS
              value: "false"  # Disabled for demo
            - name: VITE_ENABLE_USER_ACCOUNTS
              value: "false"  # Demo mode - no user accounts
            - name: VITE_MAX_ANALYSIS_POINTS
              value: "10"     # Limit for demo
            - name: VITE_DEFAULT_MAP_CENTER_LAT
              value: "39.8283"  # Washington, DC
            - name: VITE_DEFAULT_MAP_CENTER_LNG
              value: "-98.5795" # Geographic center of US
            - name: VITE_DEFAULT_MAP_ZOOM
              value: "4"
            
            # Demo-specific settings
            - name: VITE_DEMO_MODE
              value: "true"
            - name: VITE_SHOW_DEMO_BANNER
              value: "true"
            - name: VITE_DEMO_MESSAGE
              value: "This is a demonstration of SocialMapper. Results are for testing purposes only."
            
            # Performance settings
            - name: VITE_ENABLE_SERVICE_WORKER
              value: "true"
            - name: VITE_ENABLE_PWA
              value: "false"  # Disabled for demo
            
            # Pod information
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp-storage
              mountPath: /tmp
            - name: cache-storage
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0644
        - name: tmp-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: cache-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: nginx-pid
          emptyDir:
            sizeLimit: 10Mi
      
      # Spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["socialmapper-ui"]
                topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30

---
# UI Service
apiVersion: v1
kind: Service
metadata:
  name: socialmapper-ui-service
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: socialmapper-ui

---
# Horizontal Pod Autoscaler for UI
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socialmapper-ui-hpa
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socialmapper-ui
  minReplicas: 2
  maxReplicas: 10  # UI scales less than API
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min

---
# Pod Disruption Budget for UI
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: socialmapper-ui-pdb
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: availability
spec:
  minAvailable: 1  # Always keep at least 1 pod running
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui

---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: socialmapper-ui-metrics
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      honorLabels: true