# Canary Deployment Configuration for SocialMapper
apiVersion: v1
kind: Namespace
metadata:
  name: socialmapper-canary
  labels:
    deployment-strategy: canary
    app.kubernetes.io/part-of: socialmapper

---
# Istio Service Mesh Configuration
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: socialmapper-istio
  namespace: istio-system
spec:
  components:
    pilot:
      k8s:
        env:
          - name: PILOT_ENABLE_WORKLOAD_ENTRY_AUTOREGISTRATION
            value: true
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

---
# Canary API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialmapper-api-canary
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: socialmapper
    app.kubernetes.io/version: "canary"
    deployment-type: canary
spec:
  replicas: 1  # Start with minimal replicas for canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-api
      app.kubernetes.io/version: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialmapper-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: canary
        deployment-type: canary
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        canary.deployment.timestamp: "{{ .Values.deploymentTimestamp }}"
    spec:
      serviceAccountName: socialmapper-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
        - name: wait-for-redis
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              until nc -z redis-service.socialmapper.svc.cluster.local 6379; do
                echo "Waiting for Redis...";
                sleep 2;
              done;
              echo "Redis is ready!";
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
        
        - name: canary-validation
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Performing canary pre-deployment validation..."
              # Add custom validation logic here
              echo "Canary validation completed successfully"
      
      containers:
        - name: api
          image: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-api:{{ .Values.imageTag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          env:
            # Add canary-specific environment variables
            - name: DEPLOYMENT_TYPE
              value: "canary"
            - name: CANARY_STAGE
              value: "{{ .Values.canary.stage }}"
            - name: FEATURE_FLAGS_CANARY
              value: "{{ .Values.canary.featureFlags }}"
            
            # Standard environment variables (same as main deployment)
            - name: SOCIALMAPPER_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_HOST
            - name: SOCIALMAPPER_API_PORT
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_PORT
            - name: SOCIALMAPPER_API_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_WORKERS
            - name: SOCIALMAPPER_API_LOG_LEVEL
              value: "DEBUG"  # More verbose logging for canary
            - name: SOCIALMAPPER_API_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: socialmapper-config
                  key: SOCIALMAPPER_API_CORS_ORIGINS
            
            # Secrets
            - name: SOCIALMAPPER_API_CENSUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: socialmapper-secrets
                  key: SOCIALMAPPER_API_CENSUS_API_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: socialmapper-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service.socialmapper.svc.cluster.local:6379/0"
            
            # Pod information
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          volumeMounts:
            - name: results-storage
              mountPath: /app/results
            - name: tmp-storage
              mountPath: /tmp
            - name: cache-storage
              mountPath: /app/cache
          
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15  # More frequent checks for canary
            timeoutSeconds: 10
            failureThreshold: 2  # Fail faster for canary
          
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5   # More frequent checks
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 1
          
          # Enhanced startup probe for canary
          startupProbe:
            httpGet:
              path: /api/v1/health/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
            successThreshold: 1
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      
      volumes:
        - name: results-storage
          persistentVolumeClaim:
            claimName: api-results-pvc
        - name: tmp-storage
          emptyDir:
            sizeLimit: 1Gi
        - name: cache-storage
          emptyDir:
            sizeLimit: 2Gi
      
      # Enhanced affinity for canary deployments
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["socialmapper-api"]
                  - key: app.kubernetes.io/version
                    operator: NotIn
                    values: ["canary"]
              topologyKey: kubernetes.io/hostname
        
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values: ["compute-intensive"]
      
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "compute-intensive"
          effect: "NoSchedule"
      
      terminationGracePeriodSeconds: 30

---
# Canary UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialmapper-ui-canary
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: socialmapper
    app.kubernetes.io/version: "canary"
    deployment-type: canary
spec:
  replicas: 1  # Start with minimal replicas for canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: socialmapper-ui
      app.kubernetes.io/version: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialmapper-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: canary
        deployment-type: canary
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: socialmapper-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      initContainers:
        - name: wait-for-api
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              # Wait for both stable and canary API to be ready
              until nc -z socialmapper-api-service.socialmapper.svc.cluster.local 8000; do
                echo "Waiting for stable API...";
                sleep 2;
              done;
              echo "APIs are ready!";
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
      
      containers:
        - name: ui
          image: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-ui:{{ .Values.imageTag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            # Canary-specific configuration
            - name: DEPLOYMENT_TYPE
              value: "canary"
            - name: VITE_CANARY_MODE
              value: "true"
            - name: VITE_CANARY_BANNER
              value: "true"
            - name: VITE_CANARY_MESSAGE
              value: "You are using the canary version of SocialMapper"
            
            # API endpoint configuration
            - name: VITE_API_URL
              value: "https://demo.socialmapper.com/api"
            - name: VITE_API_VERSION
              value: "v1"
            
            # Enhanced debugging for canary
            - name: VITE_DEBUG_MODE
              value: "true"
            - name: VITE_LOG_LEVEL
              value: "debug"
            
            # Feature flags for canary testing
            - name: VITE_ENABLE_NEW_FEATURES
              value: "{{ .Values.canary.enableNewFeatures }}"
            - name: VITE_EXPERIMENTAL_UI
              value: "{{ .Values.canary.experimentalUI }}"
            
            # Standard configuration
            - name: VITE_APP_TITLE
              value: "SocialMapper Demo (Canary)"
            - name: VITE_APP_VERSION
              value: "{{ .Values.imageTag }}"
            - name: VITE_APP_ENVIRONMENT
              value: "canary"
            
            # Demo settings
            - name: VITE_DEMO_MODE
              value: "true"
            - name: VITE_SHOW_DEMO_BANNER
              value: "true"
            - name: VITE_DEMO_MESSAGE
              value: "This is a canary deployment - new features may be unstable"
            
            # Pod information
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp-storage
              mountPath: /tmp
            - name: cache-storage
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15  # More frequent for canary
            timeoutSeconds: 5
            failureThreshold: 2
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0644
        - name: tmp-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: cache-storage
          emptyDir:
            sizeLimit: 100Mi
        - name: nginx-pid
          emptyDir:
            sizeLimit: 10Mi
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["socialmapper-ui"]
                  - key: app.kubernetes.io/version
                    operator: NotIn
                    values: ["canary"]
              topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30

---
# Canary Services
apiVersion: v1
kind: Service
metadata:
  name: socialmapper-api-canary-service
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: canary
    deployment-type: canary
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: socialmapper-api
    app.kubernetes.io/version: canary

---
apiVersion: v1
kind: Service
metadata:
  name: socialmapper-ui-canary-service
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: canary
    deployment-type: canary
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/version: canary

---
# Istio Gateway Configuration
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: socialmapper-gateway
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: socialmapper-tls
      hosts:
        - demo.socialmapper.com
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - demo.socialmapper.com
      tls:
        httpsRedirect: true

---
# Istio VirtualService for Canary Traffic Management
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: socialmapper-api-canary
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
    deployment-type: canary
spec:
  hosts:
    - demo.socialmapper.com
  gateways:
    - socialmapper-gateway
  http:
    # API routes with canary traffic splitting
    - match:
        - uri:
            prefix: "/api/v1/"
      fault:
        delay:
          percentage:
            value: 0.1  # 0.1% of requests get 3s delay for testing
          fixedDelay: 3s
      route:
        - destination:
            host: socialmapper-api-service.socialmapper.svc.cluster.local
            port:
              number: 8000
          weight: "{{ .Values.canary.stableWeight | default 95 }}"
        - destination:
            host: socialmapper-api-canary-service.socialmapper.svc.cluster.local
            port:
              number: 8000
          weight: "{{ .Values.canary.canaryWeight | default 5 }}"
          headers:
            request:
              add:
                x-canary-request: "true"
                x-canary-version: "{{ .Values.imageTag }}"
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: 5xx,reset,connect-failure,refused-stream
    
    # Health check routes (always go to stable for infrastructure monitoring)
    - match:
        - uri:
            exact: "/api/v1/health"
        - uri:
            exact: "/api/v1/health/ready"
      route:
        - destination:
            host: socialmapper-api-service.socialmapper.svc.cluster.local
            port:
              number: 8000

---
# Istio VirtualService for UI Canary
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: socialmapper-ui-canary
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
    deployment-type: canary
spec:
  hosts:
    - demo.socialmapper.com
  gateways:
    - socialmapper-gateway
  http:
    # Static assets (always serve from stable)
    - match:
        - uri:
            prefix: "/assets/"
        - uri:
            prefix: "/static/"
      route:
        - destination:
            host: socialmapper-ui-service.socialmapper.svc.cluster.local
            port:
              number: 8080
    
    # Health checks (always go to stable)
    - match:
        - uri:
            exact: "/health"
      route:
        - destination:
            host: socialmapper-ui-service.socialmapper.svc.cluster.local
            port:
              number: 8080
    
    # UI routes with header-based canary routing
    - match:
        - headers:
            x-canary-user:
              exact: "true"
      route:
        - destination:
            host: socialmapper-ui-canary-service.socialmapper.svc.cluster.local
            port:
              number: 8080
          headers:
            response:
              add:
                x-served-by: "canary"
                x-canary-version: "{{ .Values.imageTag }}"
    
    # Default UI routes with percentage-based canary
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: socialmapper-ui-service.socialmapper.svc.cluster.local
            port:
              number: 8080
          weight: "{{ .Values.canary.ui.stableWeight | default 98 }}"
        - destination:
            host: socialmapper-ui-canary-service.socialmapper.svc.cluster.local
            port:
              number: 8080
          weight: "{{ .Values.canary.ui.canaryWeight | default 2 }}"
          headers:
            response:
              add:
                x-served-by: "canary"
                x-canary-version: "{{ .Values.imageTag }}"

---
# Istio DestinationRule for Load Balancing and Circuit Breaking
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: socialmapper-api-destination
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
spec:
  host: "*.socialmapper.svc.cluster.local"
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 3
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30

---
# ServiceMonitor for Canary Metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: socialmapper-canary-metrics
  namespace: socialmapper
  labels:
    app.kubernetes.io/part-of: socialmapper
    deployment-type: canary
spec:
  selector:
    matchLabels:
      deployment-type: canary
  endpoints:
    - port: http
      interval: 15s  # More frequent scraping for canary
      path: /metrics
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
        - sourceLabels: [__meta_kubernetes_pod_label_deployment_type]
          targetLabel: deployment_type