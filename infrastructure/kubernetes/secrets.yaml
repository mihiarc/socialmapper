# Secrets for SocialMapper Application
# Note: These are examples - real secrets should be created using kubectl or sealed-secrets

apiVersion: v1
kind: Secret
metadata:
  name: socialmapper-secrets
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Census Bureau API Key (required for demographic analysis)
  SOCIALMAPPER_API_CENSUS_API_KEY: "your_census_api_key_here"
  
  # API Keys for demo authentication (comma-separated)
  SOCIALMAPPER_API_API_KEYS: "demo-key-1,demo-key-2,demo-key-3"
  
  # Redis Authentication
  REDIS_PASSWORD: "your_redis_password_here"
  
  # Database Credentials (for future PostgreSQL integration)
  POSTGRES_USERNAME: "postgres"
  POSTGRES_PASSWORD: "your_secure_password_here"
  
  # JWT Secret for session management
  JWT_SECRET_KEY: "your_jwt_secret_key_here"
  
  # External API Keys
  OPENSTREETMAP_API_KEY: "optional_osm_api_key"
  MAPBOX_API_KEY: "optional_mapbox_api_key"
  
---
# Secret for TLS certificates (if not using cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: socialmapper-tls
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # These should be replaced with actual certificates
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
  
---
# Service Account for application pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: socialmapper-sa
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: serviceaccount
  annotations:
    # EKS IAM Role for Service Account (IRSA)
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/socialmapper-pod-role"
automountServiceAccountToken: true
  
---
# Role for service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: socialmapper-role
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: rbac
rules:
  # Allow reading secrets and configmaps
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
  
  # Allow reading pods for health checks
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  
  # Allow creating events for logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
# Role binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: socialmapper-rolebinding
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: socialmapper-role
subjects:
  - kind: ServiceAccount
    name: socialmapper-sa
    namespace: socialmapper
    
---
# Secret for image pull (if using private ECR)
apiVersion: v1
kind: Secret
metadata:
  name: ecr-secret
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: image-pull
type: kubernetes.io/dockerconfigjson
