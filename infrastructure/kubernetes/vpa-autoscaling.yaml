# Vertical Pod Autoscaler Configuration for SocialMapper
# VPA works alongside HPA to optimize resource allocation

---
# VPA for API deployment
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: socialmapper-api-vpa
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-api
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: socialmapper
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socialmapper-api
  
  updatePolicy:
    updateMode: "Auto"  # Automatically apply recommendations
    minReplicas: 2      # Ensure minimum availability during updates
  
  resourcePolicy:
    containerPolicies:
    - containerName: api
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 2000m     # 2 CPU cores max per pod
        memory: 4Gi    # 4GB max per pod
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
    
    # Init container resource policy
    - containerName: wait-for-redis
      mode: "Off"  # Don't autoscale init containers
      
  # Recommendation policies
  recommenders:
  - name: default
  - name: performance-recommender
    
---
# VPA for UI deployment
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: socialmapper-ui-vpa
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper-ui
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: socialmapper
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socialmapper-ui
  
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 1      # UI can have lower minimum during updates
  
  resourcePolicy:
    containerPolicies:
    - containerName: ui
      minAllowed:
        cpu: 50m
        memory: 64Mi
      maxAllowed:
        cpu: 500m      # 0.5 CPU cores max per UI pod
        memory: 512Mi  # 512MB max per UI pod
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
    
    # Init container policy
    - containerName: wait-for-api
      mode: "Off"
      
---
# VPA for Redis deployment
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: redis-vpa
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: socialmapper
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis
  
  updatePolicy:
    updateMode: "Initial"  # Only apply recommendations at pod creation
  
  resourcePolicy:
    containerPolicies:
    - containerName: redis
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 1000m     # 1 CPU core max for Redis
        memory: 2Gi    # 2GB max for Redis
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
# VPA Recommender Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-recommender-config
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: vpa-config
data:
  recommender-config.yaml: |
    recommenders:
    - name: default
      recommenderName: default
      
    - name: performance-recommender
      recommenderName: performance
      config:
        # Longer observation window for stable recommendations
        cpu:
          histogramBucketSizeGrowth: 0.05
          histogramMaxAge: 168h  # 7 days
          targetUtilization: 0.7
        memory:
          histogramBucketSizeGrowth: 0.05
          histogramMaxAge: 168h  # 7 days
          targetUtilization: 0.8
        
        # Safety margins
        safetyMarginFraction: 0.15
        podLifeTimeThreshold: 24h
        
        # Recommendation frequency
        checkpointsWriteTimeout: 5m
        minCheckpointAge: 10m

---
# VPA Admission Controller Webhook Configuration
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionWebhook
metadata:
  name: vpa-webhook-config-socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: vpa-webhook
webhooks:
- name: vpa-webhook.socialmapper.com
  clientConfig:
    service:
      name: vpa-webhook
      namespace: kube-system
      path: "/webhook"
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  namespaceSelector:
    matchLabels:
      name: socialmapper
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  failurePolicy: Ignore  # Don't block pod creation if VPA is unavailable

---
# Quality of Service Class for VPA pods
apiVersion: v1
kind: LimitRange
metadata:
  name: vpa-qos-limits
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: socialmapper
    app.kubernetes.io/component: vpa-qos
spec:
  limits:
  # Ensure VPA-managed pods get appropriate QoS class
  - default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    type: Container
    
---
# VPA Metrics Service for monitoring VPA performance
apiVersion: v1
kind: Service
metadata:
  name: vpa-metrics-service
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: vpa-metrics
    app.kubernetes.io/component: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: vpa-recommender
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# ServiceMonitor for VPA metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vpa-metrics
  namespace: socialmapper
  labels:
    app.kubernetes.io/name: vpa-metrics
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vpa-metrics
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true