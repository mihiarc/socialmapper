# CodeQL configuration for SocialMapper
name: "SocialMapper CodeQL config"

# Define the queries to run
queries:
  - uses: security-extended
  - uses: security-and-quality
  - uses: security-experimental

# Custom query suites for specific vulnerabilities
query-filters:
  - exclude:
      id: js/unused-local-variable
  - exclude:
      id: py/unused-import

# Path filters to focus scanning
paths:
  - socialmapper-api
  - socialmapper-ui/src
  - infrastructure

paths-ignore:
  - node_modules
  - '**/*.test.js'
  - '**/*.test.ts'
  - '**/*.spec.js'
  - '**/*.spec.ts'
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/vendor/**'
  - '**/.venv/**'
  - '**/venv/**'

# Language-specific configuration
languages:
  javascript:
    index:
      include:
        - socialmapper-ui/src
      exclude:
        - socialmapper-ui/node_modules
        - socialmapper-ui/dist
        - socialmapper-ui/build
  
  python:
    index:
      include:
        - socialmapper-api
        - socialmapper
      exclude:
        - '**/__pycache__'
        - '**/.pytest_cache'
        - '**/venv'
        - '**/.venv'

# Additional security checks
packs:
  javascript:
    - codeql/javascript-queries
    - advanced-security/javascript-sinks
  python:
    - codeql/python-queries
    - advanced-security/python-taint-tracking