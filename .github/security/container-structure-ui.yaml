# Container Structure Tests for SocialMapper UI
schemaVersion: 2.0.0

# Metadata tests
metadataTest:
  - key: 'LABEL'
    value: 'maintainer'
  - key: 'LABEL'
    value: 'version'
  - key: 'USER'
    value: 'nginx'
  - key: 'WORKDIR'
    value: '/usr/share/nginx/html'

# File existence tests
fileExistenceTests:
  - name: 'Index HTML File'
    path: '/usr/share/nginx/html/index.html'
    shouldExist: true
    permissions: '-rw-r--r--'
  
  - name: 'Nginx Config'
    path: '/etc/nginx/nginx.conf'
    shouldExist: true
  
  - name: 'No Node Modules in Production'
    path: '/usr/share/nginx/html/node_modules'
    shouldExist: false
  
  - name: 'No Source Maps in Production'
    path: '/usr/share/nginx/html/assets/*.map'
    shouldExist: false
  
  - name: 'No Environment Files'
    path: '/usr/share/nginx/html/.env'
    shouldExist: false
  
  - name: 'No Git Directory'
    path: '/usr/share/nginx/html/.git'
    shouldExist: false

# File content tests
fileContentTests:
  - name: 'Security Headers Configured'
    path: '/etc/nginx/conf.d/default.conf'
    expectedContents:
      - 'add_header X-Frame-Options "SAMEORIGIN" always;'
      - 'add_header X-Content-Type-Options "nosniff" always;'
      - 'add_header X-XSS-Protection "1; mode=block" always;'
      - 'add_header Referrer-Policy "strict-origin-when-cross-origin" always;'
      - 'add_header Content-Security-Policy'
    excludedContents:
      - 'autoindex on'
      - 'server_tokens on'
  
  - name: 'HTTPS Redirect Configured'
    path: '/etc/nginx/conf.d/default.conf'
    expectedContents:
      - 'return 301 https://$host$request_uri;'
  
  - name: 'Rate Limiting Configured'
    path: '/etc/nginx/nginx.conf'
    expectedContents:
      - 'limit_req_zone'
      - 'limit_req'

# Command tests
commandTests:
  - name: 'Nginx Version'
    command: 'nginx'
    args: ['-v']
    expectedOutput: ['nginx']
  
  - name: 'Nginx Config Valid'
    command: 'nginx'
    args: ['-t']
    exitCode: 0
  
  - name: 'User is not root'
    command: 'whoami'
    expectedOutput: ['nginx']
    excludedOutput: ['root']
  
  - name: 'No package managers'
    command: 'which'
    args: ['npm']
    exitCode: 1
  
  - name: 'No build tools'
    command: 'which'
    args: ['webpack']
    exitCode: 1
  
  - name: 'Static files served correctly'
    command: 'test'
    args: ['-f', '/usr/share/nginx/html/index.html']
    exitCode: 0

# Environment variable tests
envVars:
  - key: 'NGINX_WORKER_PROCESSES'
    value: 'auto'
  
  - key: 'NGINX_WORKER_CONNECTIONS'
    value: '1024'

# License tests
licenseTests:
  - debian: false
    files: []