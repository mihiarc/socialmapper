# Container Structure Tests for SocialMapper API
schemaVersion: 2.0.0

# Metadata tests
metadataTest:
  - key: 'LABEL'
    value: 'maintainer'
  - key: 'LABEL'
    value: 'version'
  - key: 'USER'
    value: 'appuser'
  - key: 'WORKDIR'
    value: '/app'

# File existence tests
fileExistenceTests:
  - name: 'API Server Main File'
    path: '/app/api_server/main.py'
    shouldExist: true
    permissions: '-rw-r--r--'
  
  - name: 'Requirements File'
    path: '/app/requirements.txt'
    shouldExist: true
  
  - name: 'No Root SSH Keys'
    path: '/root/.ssh'
    shouldExist: false
  
  - name: 'No AWS Credentials'
    path: '/root/.aws'
    shouldExist: false
  
  - name: 'No Bash History'
    path: '/root/.bash_history'
    shouldExist: false

# File content tests
fileContentTests:
  - name: 'Non-root User Configured'
    path: '/etc/passwd'
    expectedContents: ['appuser:x:1000:1000']
  
  - name: 'Security Headers in Nginx Config'
    path: '/etc/nginx/nginx.conf'
    expectedContents: 
      - 'X-Frame-Options SAMEORIGIN'
      - 'X-Content-Type-Options nosniff'
      - 'X-XSS-Protection "1; mode=block"'
    excludedContents:
      - 'server_tokens on'

# Command tests
commandTests:
  - name: 'Python Version'
    command: 'python'
    args: ['--version']
    expectedOutput: ['Python 3.11']
  
  - name: 'User is not root'
    command: 'whoami'
    expectedOutput: ['appuser']
    excludedOutput: ['root']
  
  - name: 'No sudo installed'
    command: 'which'
    args: ['sudo']
    exitCode: 1
  
  - name: 'Security packages installed'
    command: 'pip'
    args: ['list']
    expectedOutput: 
      - 'bandit'
      - 'safety'
  
  - name: 'Vulnerability scan passes'
    command: 'safety'
    args: ['check', '--json']
    exitCode: 0
  
  - name: 'API starts successfully'
    command: 'python'
    args: ['-c', 'from api_server.main import app; print("API loaded")']
    expectedOutput: ['API loaded']

# Environment variable tests
envVars:
  - key: 'PYTHONDONTWRITEBYTECODE'
    value: '1'
  
  - key: 'PYTHONUNBUFFERED'
    value: '1'
  
  - key: 'APP_ENV'
    value: 'production'
  
  - key: 'LOG_LEVEL'
    value: 'INFO'

# License tests
licenseTests:
  - debian: false
    files: []