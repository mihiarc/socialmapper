# Comprehensive Security Analysis Workflow for SocialMapper
# This workflow performs deep security analysis and is triggered on demand or schedule
name: Comprehensive Security Analysis

on:
  schedule:
    # Run comprehensive security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_level:
        description: 'Security scan level'
        required: true
        default: 'comprehensive'
        type: choice
        options:
        - quick
        - standard
        - comprehensive
        - paranoid
      include_penetration_test:
        description: 'Include automated penetration testing'
        required: false
        default: false
        type: boolean
      include_compliance_check:
        description: 'Include compliance checks (GDPR, HIPAA, PCI-DSS)'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  GO_VERSION: '1.21'
  SECURITY_REPORT_DIR: 'security-reports'
  SARIF_UPLOAD_ENABLED: true

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ==================== Advanced SAST Analysis ====================
  
  advanced-sast:
    name: Advanced Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Multi-language security analysis
      - name: SonarCloud Security Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=socialmapper
            -Dsonar.projectKey=socialmapper
            -Dsonar.sources=.
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.javascript.node=${{ env.NODE_VERSION }}

      # Advanced Python analysis
      - name: Pylint security analysis
        run: |
          pip install pylint pylint-django pylint-flask
          pylint --load-plugins=pylint_django,pylint_flask \
                 --disable=all \
                 --enable=security \
                 --output-format=json \
                 socialmapper-api/ socialmapper/ > pylint-security.json || true

      # Advanced JavaScript/TypeScript analysis
      - name: JSHint security analysis
        run: |
          npm install -g jshint
          jshint --reporter=json socialmapper-ui/src/ > jshint-report.json || true

      # Custom security rules with Semgrep
      - name: Custom Semgrep rules
        run: |
          pip install semgrep
          semgrep --config=.github/security/custom-rules/ \
                  --json \
                  --output=custom-semgrep-results.json \
                  . || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: sast-reports
          path: |
            pylint-security.json
            jshint-report.json
            custom-semgrep-results.json

  # ==================== Supply Chain Security ====================
  
  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SBOM generation and analysis
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom-spdx.json
          output-format: sarif
          fail-build: false

      # Dependency confusion attack prevention
      - name: Check for dependency confusion
        run: |
          # Python packages
          pip install confusion-checker
          confusion-checker --requirements socialmapper-api/requirements.txt \
                           --output python-confusion-report.json || true
          
          # Node packages
          cd socialmapper-ui
          npx dependency-confusion-checker --output ../node-confusion-report.json || true

      # Supply chain attack detection
      - name: Socket.dev security scan
        uses: socketdev/socket-scan-action@v1
        with:
          api-token: ${{ secrets.SOCKET_TOKEN }}
          issue-on-new: true
          issue-on-update: true

      # Package integrity verification
      - name: Verify package integrity
        run: |
          # Verify Python package signatures
          pip install pip-audit sigstore
          pip-audit --desc --format json --output pip-audit-full.json || true
          
          # Verify npm package integrity
          cd socialmapper-ui
          npm audit signatures || true

      - name: Upload supply chain reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: supply-chain-reports
          path: |
            sbom-spdx.json
            python-confusion-report.json
            node-confusion-report.json
            pip-audit-full.json

  # ==================== Runtime Security Analysis ====================
  
  runtime-security:
    name: Runtime Security Analysis
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Dynamic Application Security Testing (DAST)
      - name: Start applications
        run: |
          # Start API server
          cd socialmapper-api
          pip install -r requirements.txt
          uvicorn api_server.main:app --host 0.0.0.0 --port 8000 &
          API_PID=$!
          
          # Start UI server
          cd ../socialmapper-ui
          npm ci
          npm run dev -- --port 3000 &
          UI_PID=$!
          
          # Wait for services to be ready
          sleep 30
          
          # Save PIDs for cleanup
          echo $API_PID > /tmp/api.pid
          echo $UI_PID > /tmp/ui.pid

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.github/security/zap-rules.tsv'
          cmd_options: '-a -j -l INFO'
          artifact_name: 'zap_full_scan'

      - name: Nuclei vulnerability scan
        run: |
          # Install nuclei
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          
          # Run nuclei scan
          nuclei -u http://localhost:8000 \
                 -t cves/ -t vulnerabilities/ -t misconfiguration/ \
                 -severity critical,high,medium \
                 -json -o nuclei-results.json || true

      - name: API Security Testing
        run: |
          # Install API security tools
          pip install apisec-toolkit
          
          # Run API security tests
          apisec-scan --target http://localhost:8000/docs \
                      --output api-security-report.json || true

      - name: Cleanup services
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then kill $(cat /tmp/api.pid) || true; fi
          if [ -f /tmp/ui.pid ]; then kill $(cat /tmp/ui.pid) || true; fi

      - name: Upload runtime security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: runtime-security-reports
          path: |
            zap_full_scan/
            nuclei-results.json
            api-security-report.json

  # ==================== Cloud Security Posture ====================
  
  cloud-security:
    name: Cloud Security Posture
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_level == 'comprehensive' || github.event.inputs.scan_level == 'paranoid'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # AWS Security Hub checks
      - name: AWS Security Hub assessment
        run: |
          # Install AWS CLI v2
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          
          # Get Security Hub findings
          aws securityhub get-findings \
              --filters '{"ProductArn": [{"Value": "arn:aws:securityhub:*:*:product/aws/securityhub","Comparison": "EQUALS"}]}' \
              --output json > security-hub-findings.json || true

      # Cloud security posture scanning
      - name: Prowler cloud security scan
        run: |
          # Install prowler
          pip install prowler
          
          # Run prowler scan
          prowler aws --output-formats json \
                      --output-directory prowler-output/ \
                      --compliance cis_2.0 || true

      # ScoutSuite cloud security audit
      - name: ScoutSuite AWS audit
        run: |
          pip install scoutsuite
          scout aws --no-browser --report-dir scout-report/ || true

      - name: Upload cloud security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cloud-security-reports
          path: |
            security-hub-findings.json
            prowler-output/
            scout-report/

  # ==================== Compliance and Governance ====================
  
  compliance-governance:
    name: Compliance and Governance
    runs-on: ubuntu-latest
    if: github.event.inputs.include_compliance_check == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GDPR compliance check
      - name: GDPR compliance scan
        run: |
          # Install GDPR checker
          npm install -g gdpr-checker
          
          # Scan for GDPR compliance
          gdpr-checker scan \
                      --path . \
                      --output gdpr-report.json || true

      # HIPAA compliance check
      - name: HIPAA compliance scan
        run: |
          pip install hipaa-compliance-checker
          hipaa-check --path . \
                     --output hipaa-report.json || true

      # PCI-DSS compliance check  
      - name: PCI-DSS compliance scan
        run: |
          # Check for PCI-DSS compliance
          docker run --rm -v $(pwd):/src \
                     aquasec/trivy config /src \
                     --compliance pci-dss \
                     --format json \
                     --output /src/pci-dss-report.json || true

      # SOC 2 compliance check
      - name: SOC 2 compliance assessment
        run: |
          # Create SOC 2 compliance checklist
          python .github/scripts/soc2-compliance-check.py \
                 --output soc2-report.json || true

      # CIS Benchmarks
      - name: CIS Benchmark compliance
        run: |
          # Docker CIS Benchmark
          docker run --rm --net host --pid host --userns host --cap-add audit_control \
                     -v /var/lib:/var/lib:ro \
                     -v /var/run/docker.sock:/var/run/docker.sock:ro \
                     --label docker_bench_security \
                     docker/docker-bench-security \
                     -l docker-bench-results.json || true

      - name: Upload compliance reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: compliance-reports
          path: |
            gdpr-report.json
            hipaa-report.json
            pci-dss-report.json
            soc2-report.json
            docker-bench-results.json

  # ==================== Penetration Testing ====================
  
  penetration-testing:
    name: Automated Penetration Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.include_penetration_test == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Metasploit automated testing
      - name: Metasploit vulnerability scan
        run: |
          # Run Metasploit in Docker
          docker run --rm -v $(pwd):/workspace \
                     metasploitframework/metasploit-framework \
                     msfconsole -x "db_init; workspace -a socialmapper; \
                                   db_nmap -sV localhost; \
                                   analyze; \
                                   exit" > metasploit-results.txt || true

      # SQLMap for SQL injection testing
      - name: SQLMap SQL injection test
        run: |
          # Install sqlmap
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git sqlmap-dev
          
          # Run SQL injection tests
          python sqlmap-dev/sqlmap.py \
                 -u "http://localhost:8000/api/v1/analysis" \
                 --batch \
                 --random-agent \
                 --level=5 \
                 --risk=3 \
                 --output-dir=sqlmap-output || true

      # XSS testing
      - name: XSStrike XSS testing
        run: |
          # Install XSStrike
          git clone https://github.com/s0md3v/XSStrike.git
          cd XSStrike
          pip install -r requirements.txt
          
          # Run XSS tests
          python xsstrike.py \
                 -u "http://localhost:3000" \
                 --crawl \
                 --json > ../xss-report.json || true

      - name: Upload penetration test reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: penetration-test-reports
          path: |
            metasploit-results.txt
            sqlmap-output/
            xss-report.json

  # ==================== Security Metrics and Reporting ====================
  
  security-metrics:
    name: Security Metrics and Reporting
    runs-on: ubuntu-latest
    needs: [
      advanced-sast,
      supply-chain-security,
      runtime-security,
      cloud-security,
      compliance-governance,
      penetration-testing
    ]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ${{ env.SECURITY_REPORT_DIR }}

      - name: Generate security metrics
        run: |
          python .github/scripts/generate-security-metrics.py \
                 --input-dir ${{ env.SECURITY_REPORT_DIR }} \
                 --output-file security-metrics.json

      - name: Generate comprehensive security report
        run: |
          python .github/scripts/generate-comprehensive-security-report.py \
                 --input-dir ${{ env.SECURITY_REPORT_DIR }} \
                 --metrics-file security-metrics.json \
                 --output-html security-report.html \
                 --output-pdf security-report.pdf

      - name: Calculate security score
        id: security-score
        run: |
          SCORE=$(python .github/scripts/calculate-security-score.py \
                        --metrics-file security-metrics.json)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "Security Score: $SCORE/100" >> $GITHUB_STEP_SUMMARY

      - name: Create security dashboard
        run: |
          python .github/scripts/create-security-dashboard.py \
                 --input-dir ${{ env.SECURITY_REPORT_DIR }} \
                 --output-file security-dashboard.html

      - name: Upload final security reports
        uses: actions/upload-artifact@v3
        with:
          name: final-security-reports
          path: |
            security-metrics.json
            security-report.html
            security-report.pdf
            security-dashboard.html

      - name: Post security summary to issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = JSON.parse(fs.readFileSync('security-metrics.json', 'utf8'));
            
            const issueBody = `
            ## Daily Security Scan Report
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            **Security Score**: ${{ steps.security-score.outputs.score }}/100
            
            ### Summary
            - Critical Issues: ${metrics.critical_issues || 0}
            - High Issues: ${metrics.high_issues || 0}
            - Medium Issues: ${metrics.medium_issues || 0}
            - Low Issues: ${metrics.low_issues || 0}
            
            ### Categories
            - Vulnerabilities: ${metrics.vulnerabilities || 0}
            - Secrets Detected: ${metrics.secrets || 0}
            - License Issues: ${metrics.license_issues || 0}
            - Compliance Violations: ${metrics.compliance_violations || 0}
            
            [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Scan Report - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['security', 'automated']
            });

      # Send notifications for critical findings
      - name: Send security alerts
        if: steps.security-score.outputs.score < 70
        run: |
          echo "Critical security issues detected! Score: ${{ steps.security-score.outputs.score }}/100"
          # Add integration with alerting systems (Slack, PagerDuty, etc.)

  # ==================== Security Gate Enforcement ====================
  
  security-gate:
    name: Security Gate Enforcement
    runs-on: ubuntu-latest
    needs: [security-metrics]
    if: always()
    
    steps:
      - name: Evaluate security gate
        id: gate-decision
        run: |
          SCORE=${{ needs.security-metrics.outputs.score }}
          
          if [ "$SCORE" -lt 50 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message=Critical security issues detected. Deployment blocked." >> $GITHUB_OUTPUT
            exit 1
          elif [ "$SCORE" -lt 70 ]; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "message=Security issues detected. Manual review required." >> $GITHUB_OUTPUT
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "message=Security gate passed." >> $GITHUB_OUTPUT
          fi

      - name: Update deployment status
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.gate-decision.outputs.status }}" == "failed" ]; then
            echo "Blocking deployment due to critical security issues"
            # Add deployment blocking logic
          fi

      - name: Create security gate badge
        run: |
          STATUS="${{ steps.gate-decision.outputs.status }}"
          COLOR="red"
          if [ "$STATUS" == "passed" ]; then COLOR="green"; fi
          if [ "$STATUS" == "warning" ]; then COLOR="yellow"; fi
          
          echo "Security Gate: $STATUS" > security-gate-status.txt
          # Update README badge or status page