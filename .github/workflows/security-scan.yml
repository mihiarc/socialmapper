# Comprehensive Security Scanning Workflow for SocialMapper
name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_depth:
        description: 'Depth of security scan'
        required: false
        default: 'comprehensive'
        type: choice
        options:
        - quick
        - standard
        - comprehensive
        - full

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  GO_VERSION: '1.21'
  SARIF_UPLOAD_ENABLED: true

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  # ==================== SAST - Code Analysis ====================
  
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          add-snippet-context: true

  # Python Security Analysis
  python-security:
    name: Python Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install bandit[toml] safety pyt semgrep

      - name: Run Bandit security linter
        run: |
          bandit -r socialmapper-api/ -f json -o bandit-report.json --severity-level medium
          bandit -r socialmapper-api/ -f sarif -o bandit-results.sarif --severity-level medium || true

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Check Python dependencies with Safety
        run: |
          cd socialmapper-api
          safety check --json --output safety-report.json || true
          safety check --policy-file ../.github/security/safety-policy.json || true

      - name: Run Python Taint Analysis
        continue-on-error: true
        run: |
          cd socialmapper-api
          pyt -j 4 . || true

      - name: Upload Python security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            socialmapper-api/safety-report.json

  # JavaScript/TypeScript Security Analysis
  javascript-security:
    name: JavaScript/TypeScript Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ESLint security plugins
        run: |
          cd socialmapper-ui
          npm install --save-dev \
            eslint-plugin-security \
            eslint-plugin-security-node \
            eslint-plugin-no-unsanitized \
            eslint-plugin-no-secrets \
            @microsoft/eslint-plugin-sdl

      - name: Run ESLint security scan
        run: |
          cd socialmapper-ui
          npx eslint . --ext .js,.jsx,.ts,.tsx \
            --config ../.github/security/eslint-security.json \
            --format json \
            --output-file eslint-security-report.json || true

      - name: Run NodeJsScan
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --sarif --output njsscan-results.sarif || true'

      - name: Upload NodeJsScan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: njsscan-results.sarif
          category: njsscan

      - name: Upload JavaScript security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: javascript-security-reports
          path: |
            socialmapper-ui/eslint-security-report.json
            njsscan-results.sarif

  # ==================== Dependency Security ====================
  
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: NPM Audit Advanced
        run: |
          cd socialmapper-ui
          npm audit --json > npm-audit-report.json || true
          npx audit-ci --config ../.github/security/audit-ci.json || true
          npx better-npm-audit audit --level moderate || true

      - name: Check for dependency confusion attacks
        run: |
          cd socialmapper-ui
          npx dependency-confusion-checker || true

      - name: License compliance check
        run: |
          cd socialmapper-ui
          npx license-checker --json > license-report.json || true
          npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;CC0-1.0' || true

      - name: Python dependency check with pip-audit
        run: |
          pip install pip-audit
          cd socialmapper-api
          pip-audit --desc --format json --output pip-audit-report.json || true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'socialmapper'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --suppression .github/security/dependency-check-suppressions.xml

      - name: Upload dependency reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-reports
          path: |
            socialmapper-ui/npm-audit-report.json
            socialmapper-ui/license-report.json
            socialmapper-api/pip-audit-report.json
            reports/

  # ==================== Container Security ====================
  
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API container for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./socialmapper-api
          file: ./socialmapper-api/Dockerfile
          push: false
          tags: socialmapper-api:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI container for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./socialmapper-ui
          file: ./socialmapper-ui/Dockerfile
          push: false
          tags: socialmapper-ui:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'socialmapper-api:scan'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy API SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: trivy-api

      - name: Run Grype container scan
        uses: anchore/scan-action@v3
        with:
          image: 'socialmapper-api:scan'
          output-format: sarif
          fail-build: false
          severity-cutoff: high

      - name: Container structure test
        run: |
          # Install container-structure-test
          curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
          
          # Run structure tests
          container-structure-test test \
            --image socialmapper-api:scan \
            --config .github/security/container-structure-api.yaml || true
          
          container-structure-test test \
            --image socialmapper-ui:scan \
            --config .github/security/container-structure-ui.yaml || true

      - name: Dockerfile security best practices
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  # ==================== Infrastructure Security ====================
  
  infrastructure-security:
    name: Infrastructure Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          format: sarif
          out: tfsec-results.sarif

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          quiet: false
          soft_fail: true
          framework: terraform,kubernetes,dockerfile
          output_format: sarif
          output_file_path: checkov-results.sarif
          download_external_modules: true
          skip_check: CKV_DOCKER_2,CKV_DOCKER_3

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Kubernetes security scan with Kubesec
        run: |
          # Install kubesec
          curl -sSL https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz | tar -xz
          sudo mv kubesec /usr/local/bin/
          
          # Scan Kubernetes manifests
          for file in infrastructure/kubernetes/*.yaml; do
            echo "Scanning $file"
            kubesec scan "$file" || true
          done

      - name: Run Terrascan
        run: |
          # Install terrascan
          curl -L "https://github.com/tenable/terrascan/releases/latest/download/terrascan_Linux_x86_64.tar.gz" | tar -xz
          sudo mv terrascan /usr/local/bin
          
          # Scan infrastructure
          terrascan scan -i terraform -d infrastructure/terraform || true
          terrascan scan -i k8s -d infrastructure/kubernetes || true

  # ==================== Secret Scanning ====================
  
  secret-scanning:
    name: Secret and Credential Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/security/gitleaks.toml

      - name: detect-secrets scan
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit .secrets.baseline || true

      - name: Git history scan for secrets
        run: |
          # Install git-secrets
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets && sudo make install && cd ..
          
          # Configure git-secrets
          git secrets --register-aws
          git secrets --install
          
          # Scan history
          git secrets --scan-history || true

  # ==================== OWASP Security ====================
  
  owasp-security:
    name: OWASP Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'https://localhost:3000'
          rules_file_name: '.github/security/zap-rules.tsv'
          allow_issue_writing: false
          artifact_name: 'zap_scan'

      - name: Check for OWASP Top 10 vulnerabilities
        run: |
          # Install semgrep with OWASP rules
          pip install semgrep
          
          # Run OWASP Top 10 checks
          semgrep --config=auto \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --json \
            --output=owasp-scan-results.json \
            . || true

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: owasp-reports
          path: |
            owasp-scan-results.json
            zap_scan/

  # ==================== Compliance Checks ====================
  
  compliance-check:
    name: Security Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CIS Benchmark compliance
        run: |
          # Check for CIS Docker Benchmark compliance
          docker run --rm --net host --pid host --userns host --cap-add audit_control \
            -e DOCKER_CONTENT_TRUST=$DOCKER_CONTENT_TRUST \
            -v /etc:/etc:ro \
            -v /usr/bin/containerd:/usr/bin/containerd:ro \
            -v /usr/bin/runc:/usr/bin/runc:ro \
            -v /usr/lib/systemd:/usr/lib/systemd:ro \
            -v /var/lib:/var/lib:ro \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            --label docker_bench_security \
            docker/docker-bench-security || true

      - name: Security policy validation
        run: |
          # Validate security policies
          if [ -f .github/security/security-policy.json ]; then
            echo "Validating security policy..."
            python .github/scripts/validate-security-policy.py
          fi

      - name: Generate compliance report
        run: |
          echo "# Security Compliance Report" > compliance-report.md
          echo "Generated: $(date)" >> compliance-report.md
          echo "" >> compliance-report.md
          
          # Add compliance check results
          echo "## Compliance Checks" >> compliance-report.md
          echo "- [x] OWASP Top 10 Scan" >> compliance-report.md
          echo "- [x] CIS Benchmark Check" >> compliance-report.md
          echo "- [x] Container Security Scan" >> compliance-report.md
          echo "- [x] Dependency Vulnerability Check" >> compliance-report.md
          echo "- [x] Secret Scanning" >> compliance-report.md

      - name: Upload compliance report
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: compliance-report.md

  # ==================== Security Report Generation ====================
  
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [
      codeql-analysis,
      python-security,
      javascript-security,
      dependency-check,
      container-security,
      infrastructure-security,
      secret-scanning,
      owasp-security,
      compliance-check
    ]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: security-artifacts

      - name: Generate consolidated security report
        run: |
          python .github/scripts/generate-security-report.py \
            --input-dir security-artifacts \
            --output-file security-report.html

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.html

      - name: Post security summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'security-report.html';
            
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              
              // Extract summary from report
              const summaryMatch = report.match(/<summary>(.*?)<\/summary>/s);
              const summary = summaryMatch ? summaryMatch[1] : 'Security scan completed';
              
              // Post comment to PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Security Scan Results\n\n${summary}\n\n[View full report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            }

      - name: Send security alerts
        if: failure()
        run: |
          # Send alerts for critical findings
          echo "Critical security issues found. Sending alerts..."
          # Add integration with your alerting system (Slack, PagerDuty, etc.)

  # ==================== Security Gate ====================
  
  security-gate:
    name: Security Gate Decision
    runs-on: ubuntu-latest
    needs: [security-report]
    if: always()
    
    steps:
      - name: Evaluate security gate
        id: gate
        run: |
          # Check if any critical security issues were found
          if [ "${{ needs.secret-scanning.result }}" == "failure" ]; then
            echo "CRITICAL: Secrets detected in code!"
            echo "gate_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [ "${{ needs.container-security.result }}" == "failure" ]; then
            echo "CRITICAL: Container security issues found!"
            echo "gate_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Security gate passed"
          echo "gate_status=passed" >> $GITHUB_OUTPUT

      - name: Update deployment status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.gate.outputs.gate_status }}" == "failed" ]; then
            echo "Blocking deployment due to security issues"
            # Add logic to block deployment
          fi