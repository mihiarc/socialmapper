# Comprehensive Monitoring Stack Deployment via GitHub Actions
name: Deploy Monitoring Stack

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/monitoring/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy monitoring stack'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      monitoring_components:
        description: 'Components to deploy'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - prometheus-only
        - grafana-only
        - alertmanager-only
        - monitoring-agents
      force_redeploy:
        description: 'Force redeploy even if no changes detected'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: socialmapper-prod
  MONITORING_NAMESPACE: monitoring
  HELM_VERSION: v3.12.0
  KUBECTL_VERSION: v1.28.0

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  # ==================== Validation and Planning ====================
  
  validate-monitoring-config:
    name: Validate Monitoring Configuration
    runs-on: ubuntu-latest
    outputs:
      config-valid: ${{ steps.validate.outputs.valid }}
      components-changed: ${{ steps.changes.outputs.components }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup tools
        run: |
          # Install kubeval for Kubernetes manifest validation
          curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar -xz
          sudo mv kubeval /usr/local/bin/
          
          # Install helm
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version ${{ env.HELM_VERSION }}
          
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests..."
          for file in infrastructure/monitoring/*.yaml; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              kubeval "$file" --strict || exit 1
            fi
          done
      
      - name: Validate Prometheus configuration
        run: |
          echo "Validating Prometheus configuration..."
          docker run --rm -v "${PWD}/infrastructure/monitoring:/workspace" \
            prom/prometheus:latest \
            promtool check config /workspace/prometheus.yaml
      
      - name: Validate AlertManager configuration
        run: |
          echo "Validating AlertManager configuration..."
          docker run --rm -v "${PWD}/infrastructure/monitoring:/workspace" \
            prom/alertmanager:latest \
            amtool check-config /workspace/enhanced-alertmanager.yaml
      
      - name: Detect configuration changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files: $CHANGED_FILES"
          
          COMPONENTS=""
          if echo "$CHANGED_FILES" | grep -q "prometheus.yaml"; then
            COMPONENTS="$COMPONENTS,prometheus"
          fi
          if echo "$CHANGED_FILES" | grep -q "grafana"; then
            COMPONENTS="$COMPONENTS,grafana"
          fi
          if echo "$CHANGED_FILES" | grep -q "alertmanager"; then
            COMPONENTS="$COMPONENTS,alertmanager"
          fi
          if echo "$CHANGED_FILES" | grep -q "kube-state-metrics"; then
            COMPONENTS="$COMPONENTS,kube-state-metrics"
          fi
          
          # Remove leading comma
          COMPONENTS=$(echo "$COMPONENTS" | sed 's/^,//')
          
          echo "components=${COMPONENTS:-all}" >> $GITHUB_OUTPUT
      
      - name: Set validation result
        id: validate
        run: echo "valid=true" >> $GITHUB_OUTPUT

  # ==================== Security Scanning ====================
  
  scan-monitoring-security:
    name: Security Scan Monitoring Stack
    runs-on: ubuntu-latest
    needs: [validate-monitoring-config]
    if: needs.validate-monitoring-config.outputs.config-valid == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy security scan on monitoring configs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infrastructure/monitoring'
          format: 'sarif'
          output: 'monitoring-security-results.sarif'
      
      - name: Run Kubesec security scan
        run: |
          curl -sSL https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz | tar -xz
          sudo mv kubesec /usr/local/bin/
          
          for file in infrastructure/monitoring/*.yaml; do
            if [ -f "$file" ]; then
              echo "Scanning $file with kubesec"
              kubesec scan "$file" | jq .
            fi
          done
      
      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: monitoring-security-results.sarif
          category: monitoring-security

  # ==================== Staging Deployment ====================
  
  deploy-monitoring-staging:
    name: Deploy Monitoring to Staging
    runs-on: ubuntu-latest
    needs: [validate-monitoring-config, scan-monitoring-security]
    if: |
      needs.validate-monitoring-config.outputs.config-valid == 'true' &&
      (github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    environment: 
      name: staging
      url: https://monitoring-staging.socialmapper.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_STAGING }}
          role-session-name: MonitoringDeploymentStaging
      
      - name: Setup kubectl and helm
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Install helm
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version ${{ env.HELM_VERSION }}
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}-staging
      
      - name: Create monitoring namespace
        run: |
          kubectl create namespace ${{ env.MONITORING_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.MONITORING_NAMESPACE }} name=${{ env.MONITORING_NAMESPACE }} --overwrite
      
      - name: Deploy Prometheus
        if: contains(needs.validate-monitoring-config.outputs.components-changed, 'prometheus') || github.event.inputs.monitoring_components == 'all' || github.event.inputs.monitoring_components == 'prometheus-only'
        run: |
          echo "Deploying Prometheus to staging..."
          kubectl apply -f infrastructure/monitoring/prometheus.yaml
          
          # Wait for Prometheus to be ready
          kubectl rollout status deployment/prometheus -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s
      
      - name: Deploy kube-state-metrics
        if: contains(needs.validate-monitoring-config.outputs.components-changed, 'kube-state-metrics') || github.event.inputs.monitoring_components == 'all' || github.event.inputs.monitoring_components == 'monitoring-agents'
        run: |
          echo "Deploying kube-state-metrics to staging..."
          kubectl apply -f infrastructure/monitoring/kube-state-metrics.yaml
          
          # Wait for kube-state-metrics to be ready
          kubectl rollout status deployment/kube-state-metrics -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s
      
      - name: Deploy Grafana
        if: contains(needs.validate-monitoring-config.outputs.components-changed, 'grafana') || github.event.inputs.monitoring_components == 'all' || github.event.inputs.monitoring_components == 'grafana-only'
        run: |
          echo "Deploying Grafana to staging..."
          kubectl apply -f infrastructure/monitoring/grafana.yaml
          kubectl apply -f infrastructure/monitoring/grafana-dashboards.yaml
          
          # Wait for Grafana to be ready
          kubectl rollout status deployment/grafana -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s
      
      - name: Deploy Enhanced AlertManager
        if: contains(needs.validate-monitoring-config.outputs.components-changed, 'alertmanager') || github.event.inputs.monitoring_components == 'all' || github.event.inputs.monitoring_components == 'alertmanager-only'
        run: |
          echo "Deploying Enhanced AlertManager to staging..."
          
          # Create secrets first (with dummy values for staging)
          kubectl create secret generic enhanced-alertmanager-secret \
            --from-literal=smtp_password="staging_dummy_password" \
            --from-literal=slack_webhook_url="https://hooks.slack.com/services/staging/webhook" \
            --from-literal=pagerduty_service_key="staging_dummy_key" \
            -n ${{ env.MONITORING_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl apply -f infrastructure/monitoring/enhanced-alertmanager.yaml
          
          # Wait for AlertManager to be ready
          kubectl rollout status deployment/enhanced-alertmanager -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s
      
      - name: Run monitoring health checks
        run: |
          echo "Running health checks..."
          
          # Check Prometheus
          kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=prometheus
          PROMETHEUS_POD=$(kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=prometheus -o jsonpath="{.items[0].metadata.name}")
          if [ ! -z "$PROMETHEUS_POD" ]; then
            kubectl exec -n ${{ env.MONITORING_NAMESPACE }} $PROMETHEUS_POD -- wget -q -O- http://localhost:9090/-/healthy || exit 1
            echo "✅ Prometheus health check passed"
          fi
          
          # Check Grafana
          kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=grafana
          GRAFANA_POD=$(kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=grafana -o jsonpath="{.items[0].metadata.name}")
          if [ ! -z "$GRAFANA_POD" ]; then
            kubectl exec -n ${{ env.MONITORING_NAMESPACE }} $GRAFANA_POD -- curl -f http://localhost:3000/api/health || exit 1
            echo "✅ Grafana health check passed"
          fi
          
          # Check AlertManager
          kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=enhanced-alertmanager
          ALERTMANAGER_POD=$(kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=enhanced-alertmanager -o jsonpath="{.items[0].metadata.name}")
          if [ ! -z "$ALERTMANAGER_POD" ]; then
            kubectl exec -n ${{ env.MONITORING_NAMESPACE }} $ALERTMANAGER_POD -- wget -q -O- http://localhost:9093/-/healthy || exit 1
            echo "✅ AlertManager health check passed"
          fi
      
      - name: Run monitoring integration tests
        run: |
          echo "Running monitoring integration tests..."
          
          # Test Prometheus metrics endpoint
          kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/prometheus 9090:9090 &
          PROMETHEUS_PID=$!
          sleep 10
          
          # Test metrics endpoint
          curl -f http://localhost:9090/metrics > /dev/null || exit 1
          echo "✅ Prometheus metrics endpoint test passed"
          
          kill $PROMETHEUS_PID
          
          # Test Grafana dashboards
          kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/grafana 3000:3000 &
          GRAFANA_PID=$!
          sleep 10
          
          # Test Grafana API
          curl -f http://localhost:3000/api/health > /dev/null || exit 1
          echo "✅ Grafana API test passed"
          
          kill $GRAFANA_PID
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Monitoring Stack Deployed to Staging**\n\n' +
                    '**Components deployed:** ${{ needs.validate-monitoring-config.outputs.components-changed || "all" }}\n' +
                    '**Environment:** staging\n' +
                    '**Dashboard:** https://monitoring-staging.socialmapper.com\n\n' +
                    '**Health Checks:** All passed ✅\n' +
                    '**Integration Tests:** All passed ✅\n\n' +
                    'Ready for production deployment after PR approval.'
            })

  # ==================== Production Deployment ====================
  
  deploy-monitoring-production:
    name: Deploy Monitoring to Production
    runs-on: ubuntu-latest
    needs: [validate-monitoring-config, scan-monitoring-security]
    if: |
      needs.validate-monitoring-config.outputs.config-valid == 'true' &&
      (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    environment: 
      name: production
      url: https://monitoring.socialmapper.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_PRODUCTION }}
          role-session-name: MonitoringDeploymentProduction
      
      - name: Setup kubectl and helm
        run: |
          curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version ${{ env.HELM_VERSION }}
      
      - name: Update kubeconfig for production
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
      
      - name: Create production secrets
        run: |
          # Create production secrets from GitHub secrets
          kubectl create secret generic enhanced-alertmanager-secret \
            --from-literal=smtp_password="${{ secrets.SMTP_PASSWORD }}" \
            --from-literal=slack_webhook_url="${{ secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal=pagerduty_service_key="${{ secrets.PAGERDUTY_SERVICE_KEY }}" \
            -n ${{ env.MONITORING_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret generic grafana-secret \
            --from-literal=admin-user="${{ secrets.GRAFANA_ADMIN_USER }}" \
            --from-literal=admin-password="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            -n ${{ env.MONITORING_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Deploy monitoring stack with zero-downtime
        run: |
          echo "Deploying monitoring stack to production with zero-downtime strategy..."
          
          # Deploy components in order with health checks
          COMPONENTS=("prometheus" "kube-state-metrics" "grafana" "enhanced-alertmanager")
          
          for component in "${COMPONENTS[@]}"; do
            if [[ "$component" == "prometheus" && ("${{ needs.validate-monitoring-config.outputs.components-changed }}" == *"prometheus"* || "${{ github.event.inputs.monitoring_components }}" == "all" || "${{ github.event.inputs.monitoring_components }}" == "prometheus-only") ]]; then
              echo "Deploying $component..."
              kubectl apply -f infrastructure/monitoring/prometheus.yaml
              kubectl rollout status deployment/prometheus -n ${{ env.MONITORING_NAMESPACE }} --timeout=600s
            elif [[ "$component" == "kube-state-metrics" && ("${{ needs.validate-monitoring-config.outputs.components-changed }}" == *"kube-state-metrics"* || "${{ github.event.inputs.monitoring_components }}" == "all") ]]; then
              echo "Deploying $component..."
              kubectl apply -f infrastructure/monitoring/kube-state-metrics.yaml
              kubectl rollout status deployment/kube-state-metrics -n ${{ env.MONITORING_NAMESPACE }} --timeout=600s
            elif [[ "$component" == "grafana" && ("${{ needs.validate-monitoring-config.outputs.components-changed }}" == *"grafana"* || "${{ github.event.inputs.monitoring_components }}" == "all" || "${{ github.event.inputs.monitoring_components }}" == "grafana-only") ]]; then
              echo "Deploying $component..."
              kubectl apply -f infrastructure/monitoring/grafana.yaml
              kubectl apply -f infrastructure/monitoring/grafana-dashboards.yaml
              kubectl rollout status deployment/grafana -n ${{ env.MONITORING_NAMESPACE }} --timeout=600s
            elif [[ "$component" == "enhanced-alertmanager" && ("${{ needs.validate-monitoring-config.outputs.components-changed }}" == *"alertmanager"* || "${{ github.event.inputs.monitoring_components }}" == "all" || "${{ github.event.inputs.monitoring_components }}" == "alertmanager-only") ]]; then
              echo "Deploying $component..."
              kubectl apply -f infrastructure/monitoring/enhanced-alertmanager.yaml
              kubectl rollout status deployment/enhanced-alertmanager -n ${{ env.MONITORING_NAMESPACE }} --timeout=600s
            fi
            
            echo "✅ $component deployed successfully"
          done
      
      - name: Run comprehensive production health checks
        run: |
          echo "Running comprehensive production health checks..."
          
          # Function to check service health
          check_service_health() {
            local service=$1
            local port=$2
            local health_endpoint=$3
            
            echo "Checking $service health..."
            kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/$service $port:$port &
            local PID=$!
            sleep 15
            
            if curl -f "http://localhost:$port$health_endpoint" > /dev/null 2>&1; then
              echo "✅ $service health check passed"
              kill $PID
              return 0
            else
              echo "❌ $service health check failed"
              kill $PID
              return 1
            fi
          }
          
          # Check all services
          check_service_health "prometheus" "9090" "/-/healthy"
          check_service_health "grafana" "3000" "/api/health"
          check_service_health "enhanced-alertmanager" "9093" "/-/healthy"
          
          echo "✅ All production health checks passed"
      
      - name: Verify monitoring data flow
        run: |
          echo "Verifying monitoring data flow..."
          
          # Test Prometheus data collection
          kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/prometheus 9090:9090 &
          PROMETHEUS_PID=$!
          sleep 15
          
          # Check if metrics are being collected
          METRICS_COUNT=$(curl -s "http://localhost:9090/api/v1/query?query=up" | jq -r '.data.result | length')
          if [ "$METRICS_COUNT" -gt 0 ]; then
            echo "✅ Prometheus is collecting metrics ($METRICS_COUNT targets)"
          else
            echo "❌ Prometheus is not collecting metrics properly"
            exit 1
          fi
          
          kill $PROMETHEUS_PID
          
          echo "✅ Monitoring data flow verification completed"
      
      - name: Post-deployment monitoring setup
        run: |
          echo "Setting up post-deployment monitoring..."
          
          # Create a configmap with deployment info
          kubectl create configmap monitoring-deployment-info \
            --from-literal=deployment-time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --from-literal=git-commit="${{ github.sha }}" \
            --from-literal=deployed-by="${{ github.actor }}" \
            --from-literal=components-deployed="${{ needs.validate-monitoring-config.outputs.components-changed || 'all' }}" \
            -n ${{ env.MONITORING_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "✅ Post-deployment monitoring setup completed"
      
      - name: Send deployment notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          custom_payload: |
            {
              channel: '#deployments',
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : 'danger',
                title: 'Monitoring Stack Deployment - Production',
                fields: [
                  {
                    title: 'Status',
                    value: '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed',
                    short: true
                  },
                  {
                    title: 'Environment',
                    value: 'Production',
                    short: true
                  },
                  {
                    title: 'Components',
                    value: '${{ needs.validate-monitoring-config.outputs.components-changed || "all" }}',
                    short: true
                  },
                  {
                    title: 'Dashboard',
                    value: 'https://monitoring.socialmapper.com',
                    short: true
                  },
                  {
                    title: 'Commit',
                    value: '${{ github.sha }}',
                    short: true
                  },
                  {
                    title: 'Actor',
                    value: '${{ github.actor }}',
                    short: true
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK_URL }}