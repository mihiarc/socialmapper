# CI/CD Pipeline for SocialMapper Demo Platform
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'socialmapper/**'
      - 'socialmapper-api/**'
      - 'socialmapper-ui/**'
      - 'infrastructure/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'socialmapper/**'
      - 'socialmapper-api/**'
      - 'socialmapper-ui/**'
      - 'infrastructure/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: socialmapper-prod
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # Enhanced Security and Code Quality Checks
  security-scan:
    name: Enhanced Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CodeQL Analysis for comprehensive SAST
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:mixed"
          upload: true

      # Enhanced Trivy scanning with multiple outputs
      - name: Run Trivy vulnerability scanner - Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

      # Enhanced Semgrep with comprehensive rulesets
      - name: Run Semgrep advanced security scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/javascript
            p/typescript
            p/react
            p/dockerfile
            p/kubernetes
            p/owasp-top-ten
            p/r2c-security-audit
            p/bandit
            p/eslint-security
            p/nodejs
            p/flask
            p/django

      # Python-specific security scanning with Bandit
      - name: Run Bandit Python security scan
        run: |
          pip install bandit[toml]
          bandit -r socialmapper-api/ socialmapper/ -f json -o bandit-report.json --severity-level low
          bandit -r socialmapper-api/ socialmapper/ -f sarif -o bandit-results.sarif --severity-level medium || true

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: 'bandit'

      # Secret scanning with multiple tools
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/security/gitleaks.toml

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # License compliance check
      - name: License compliance scan
        run: |
          pip install licensecheck
          licensecheck --zero --file-extensions py js ts tsx jsx

  # Frontend Testing and Analysis
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./socialmapper-ui
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: socialmapper-ui/package-lock.json

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm ls --depth=0

      - name: Run TypeScript compilation check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check

      - name: Run unit tests with coverage
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test

      - name: Generate coverage report
        if: always()
        run: |
          npm run test:coverage:report
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./socialmapper-ui/coverage/lcov.info
          flags: frontend
          name: socialmapper-ui
          fail_ci_if_error: false

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
          VITE_APP_TITLE: 'SocialMapper Demo'
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || 'pk.test' }}

      - name: Analyze bundle size
        run: |
          npm run build:analyze
          echo "### Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npx vite-bundle-visualizer --output stats.json
          cat stats.json | jq '.assets[] | {name: .name, size: .size}' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check bundle size limits
        run: npm run size:check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: socialmapper-ui/dist
          retention-days: 7

      - name: Upload bundle stats
        uses: actions/upload-artifact@v3
        with:
          name: bundle-stats
          path: socialmapper-ui/stats.html
          retention-days: 30

  # Enhanced Frontend Security Scanning
  frontend-security:
    name: Enhanced Frontend Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./socialmapper-ui
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Enhanced npm audit with detailed reporting
      - name: Enhanced npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          npx audit-ci --config ../.github/security/audit-ci.json || true
          npx better-npm-audit audit --level low || true

      # Check for dependency confusion attacks
      - name: Dependency confusion check
        run: |
          npx dependency-confusion-checker || true
          npm ls --depth=0 --json > dependency-tree.json

      # ESLint with security plugins
      - name: ESLint security scan
        run: |
          npm install --save-dev \
            eslint-plugin-security \
            eslint-plugin-security-node \
            eslint-plugin-no-unsanitized \
            eslint-plugin-no-secrets \
            @microsoft/eslint-plugin-sdl
          npx eslint . --ext .js,.jsx,.ts,.tsx \
            --config ../.github/security/eslint-security.json \
            --format json \
            --output-file eslint-security-report.json || true

      # NodeJsScan for JavaScript security
      - name: NodeJsScan security analysis
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --sarif --output njsscan-results.sarif || true'

      - name: Upload NodeJsScan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: njsscan-results.sarif
          category: 'njsscan'

      # Enhanced Snyk scanning
      - name: Snyk vulnerability scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: >-
            --severity-threshold=low
            --file=package.json
            --json-file-output=snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # License compliance
      - name: License compliance check
        run: |
          npx license-checker --json > license-report.json || true
          npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;CC0-1.0;CC-BY-4.0' || true

      # OWASP Dependency Check with enhanced configuration
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'socialmapper-ui'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --suppression ../.github/security/dependency-check-suppressions.xml

      # Bundle size and security analysis
      - name: Bundle security analysis
        run: |
          npm run build
          npx webpack-bundle-analyzer dist/stats.json --mode json > bundle-analysis.json || true
          npx source-map-explorer dist/*.js --json > source-map-analysis.json || true

      - name: Upload enhanced security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-security-reports
          path: |
            npm-audit-report.json
            dependency-tree.json
            eslint-security-report.json
            snyk-report.json
            license-report.json
            bundle-analysis.json
            source-map-analysis.json
            reports/

  # Python API Testing
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./socialmapper-api
    
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checking
        run: |
          uv run mypy api_server/ --ignore-missing-imports

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379/0
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          uv run pytest tests/unit/ -v --cov=api_server --cov-report=xml --cov-report=html

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          uv run pytest tests/integration/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./socialmapper-api/coverage.xml
          flags: api
          name: socialmapper-api
          fail_ci_if_error: false

  # Python Package Testing
  test-package:
    name: Test Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install package in development mode
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest pytest-cov

      - name: Run package tests
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          uv run pytest tests/ -v --cov=socialmapper --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: package
          name: socialmapper-package
          fail_ci_if_error: false

  # Build and Push Images
  build-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [security-scan, test-api, test-package, test-frontend, frontend-security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    outputs:
      api-image-tag: ${{ steps.meta-api.outputs.tags }}
      ui-image-tag: ${{ steps.meta-ui.outputs.tags }}
      api-image-digest: ${{ steps.build-api.outputs.digest }}
      ui-image-digest: ${{ steps.build-ui.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/socialmapper-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: ./socialmapper-api
          file: ./socialmapper-api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Extract metadata for UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/socialmapper-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        id: build-ui
        uses: docker/build-push-action@v5
        with:
          context: ./socialmapper-ui
          file: ./socialmapper-ui/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api' }}
            VITE_APP_TITLE=SocialMapper Demo
            VITE_APP_VERSION=${{ github.sha }}
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}

      # Enhanced container security scanning
      - name: Comprehensive container security scan
        run: |
          # Trivy scan with SBOM generation
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format sarif \
            --output api-container-scan.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --scanners vuln,secret,config \
            ${{ steps.meta-api.outputs.tags }}
          
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format sarif \
            --output ui-container-scan.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --scanners vuln,secret,config \
            ${{ steps.meta-ui.outputs.tags }}

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'api-container-scan.sarif'
          category: 'container-api'

      - name: Grype container vulnerability scan
        uses: anchore/scan-action@v3
        with:
          image: ${{ steps.meta-api.outputs.tags }}
          output-format: sarif
          fail-build: false
          severity-cutoff: medium

      - name: Container structure test
        run: |
          # Install container-structure-test
          curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
          
          # Test container structure
          container-structure-test test \
            --image ${{ steps.meta-api.outputs.tags }} \
            --config .github/security/container-structure-api.yaml || true
          
          container-structure-test test \
            --image ${{ steps.meta-ui.outputs.tags }} \
            --config .github/security/container-structure-ui.yaml || true

      - name: Dockerfile security best practices
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: 'hadolint'

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to staging namespace
        run: |
          # Update image tags in manifests
          sed -i "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-api:latest|${{ needs.build-images.outputs.api-image-tag }}|g" infrastructure/kubernetes/api-deployment.yaml
          sed -i "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-ui:latest|${{ needs.build-images.outputs.ui-image-tag }}|g" infrastructure/kubernetes/ui-deployment.yaml
          
          # Apply configurations
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/configmap.yaml
          kubectl apply -f infrastructure/kubernetes/secrets.yaml
          kubectl apply -f infrastructure/kubernetes/redis.yaml
          kubectl apply -f infrastructure/kubernetes/api-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/ui-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/ingress.yaml
          
          # Wait for rollout
          kubectl rollout status deployment/socialmapper-api -n socialmapper --timeout=300s
          kubectl rollout status deployment/socialmapper-ui -n socialmapper --timeout=300s

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Get service URL
          SERVICE_URL=$(kubectl get ingress socialmapper-ingress -n socialmapper -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Health check
          curl -f "https://${SERVICE_URL}/api/v1/health" || exit 1
          
          # Basic API test
          curl -f "https://${SERVICE_URL}/api/v1/metadata/census-variables" || exit 1

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, deploy-staging]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Blue-Green Deployment
        run: |
          # Update image tags in manifests
          sed -i "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-api:latest|${{ needs.build-images.outputs.api-image-tag }}|g" infrastructure/kubernetes/api-deployment.yaml
          sed -i "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/socialmapper-ui:latest|${{ needs.build-images.outputs.ui-image-tag }}|g" infrastructure/kubernetes/ui-deployment.yaml
          
          # Apply configurations with rolling update strategy
          kubectl apply -f infrastructure/kubernetes/configmap.yaml
          kubectl apply -f infrastructure/kubernetes/secrets.yaml
          kubectl apply -f infrastructure/kubernetes/api-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/ui-deployment.yaml
          
          # Wait for rollout with health checks
          kubectl rollout status deployment/socialmapper-api -n socialmapper --timeout=600s
          kubectl rollout status deployment/socialmapper-ui -n socialmapper --timeout=600s

      - name: Production smoke tests
        run: |
          # Wait for services to stabilize
          sleep 60
          
          # Get production URL
          PROD_URL="demo.socialmapper.com"
          
          # Comprehensive health checks
          curl -f "https://${PROD_URL}/api/v1/health" || exit 1
          curl -f "https://${PROD_URL}/health" || exit 1
          
          # API functionality tests
          curl -f "https://${PROD_URL}/api/v1/metadata/census-variables" || exit 1
          curl -f "https://${PROD_URL}/api/v1/metadata/travel-modes" || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/socialmapper-api -n socialmapper
          kubectl rollout undo deployment/socialmapper-ui -n socialmapper
          kubectl rollout status deployment/socialmapper-api -n socialmapper --timeout=300s
          kubectl rollout status deployment/socialmapper-ui -n socialmapper --timeout=300s

  # Infrastructure Validation
  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'infrastructure/terraform/') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd infrastructure/terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform plan -out=tfplan

      # Enhanced infrastructure security scanning
      - name: Comprehensive Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          format: sarif
          out: tfsec-results.sarif

      - name: Upload tfsec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: 'tfsec'

      - name: Checkov infrastructure scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          quiet: false
          soft_fail: true
          framework: terraform,kubernetes,dockerfile
          output_format: sarif
          output_file_path: checkov-results.sarif
          download_external_modules: true

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: 'checkov'

      - name: Kubernetes security scan
        run: |
          # Install kubesec
          curl -sSL https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz | tar -xz
          sudo mv kubesec /usr/local/bin/
          
          # Scan Kubernetes manifests
          for file in infrastructure/kubernetes/*.yaml; do
            echo "Scanning $file"
            kubesec scan "$file" --format json >> kubesec-results.json || true
          done

      - name: Terrascan policy scan
        run: |
          # Install terrascan
          curl -L "https://github.com/tenable/terrascan/releases/latest/download/terrascan_Linux_x86_64.tar.gz" | tar -xz
          sudo mv terrascan /usr/local/bin
          
          # Scan infrastructure
          terrascan scan -i terraform -d infrastructure/terraform --output sarif > terrascan-tf.sarif || true
          terrascan scan -i k8s -d infrastructure/kubernetes --output sarif > terrascan-k8s.sarif || true

  # Notification
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    
    steps:
      - name: Notify Slack on Success
        if: needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: |
            ✅ SocialMapper deployment successful!
            Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Failure
        if: needs.deploy-production.result == 'failure' || needs.deploy-staging.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: |
            ❌ SocialMapper deployment failed!
            Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Please check the logs and take action.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}