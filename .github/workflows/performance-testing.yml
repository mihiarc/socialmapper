# Performance Testing Pipeline for SocialMapper
# This workflow runs comprehensive performance tests using k6 and Lighthouse CI
# after successful deployment to staging environment

name: Performance Testing

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [main, develop]
  
  # Allow manual trigger for performance testing
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      load_profile:
        description: 'Load testing profile'
        required: true
        default: 'load'
        type: choice
        options:
        - smoke
        - load
        - stress
        - spike
        - soak
      run_k6:
        description: 'Run k6 load tests'
        required: false
        default: true
        type: boolean
      run_lighthouse:
        description: 'Run Lighthouse CI tests'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '22'
  K6_VERSION: 'v0.47.0'
  PERFORMANCE_RESULTS_RETENTION_DAYS: 30

jobs:
  # Only run if the triggering workflow succeeded (for workflow_run events)
  check-trigger:
    name: Check Trigger Conditions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.result }}
      environment: ${{ steps.set-env.outputs.environment }}
      load_profile: ${{ steps.set-env.outputs.load_profile }}
    steps:
      - name: Check conditions
        id: check
        run: echo "result=true" >> $GITHUB_OUTPUT
      
      - name: Set environment variables
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "load_profile=${{ github.event.inputs.load_profile }}" >> $GITHUB_OUTPUT
          else
            # Auto-triggered from CI/CD pipeline
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "environment=production" >> $GITHUB_OUTPUT
            else
              echo "environment=staging" >> $GITHUB_OUTPUT
            fi
            echo "load_profile=load" >> $GITHUB_OUTPUT
          fi

  # k6 Load Testing
  k6-load-tests:
    name: k6 Load Tests
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && github.event.inputs.run_k6 == 'true' || github.event_name != 'workflow_dispatch')
    
    strategy:
      matrix:
        test_suite: [health-endpoints, metadata-endpoints, comprehensive-api]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      
      - name: Create results directory
        run: |
          mkdir -p performance/results/k6
          mkdir -p /tmp/k6-results
      
      - name: Run k6 test - ${{ matrix.test_suite }}
        env:
          TEST_ENV: ${{ needs.check-trigger.outputs.environment }}
          LOAD_PROFILE: ${{ needs.check-trigger.outputs.load_profile }}
        run: |
          echo "Running k6 test: ${{ matrix.test_suite }}"
          echo "Environment: $TEST_ENV"
          echo "Load Profile: $LOAD_PROFILE"
          
          k6 run \
            --env TEST_ENV="$TEST_ENV" \
            --env LOAD_PROFILE="$LOAD_PROFILE" \
            --out json="/tmp/k6-results/${{ matrix.test_suite }}.json" \
            --summary-trend-stats="avg,min,med,max,p(90),p(95),p(99)" \
            performance/k6/tests/${{ matrix.test_suite }}.js
      
      - name: Process k6 results
        if: always()
        run: |
          # Create summary for GitHub
          echo "## k6 Load Test Results - ${{ matrix.test_suite }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.check-trigger.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Load Profile:** ${{ needs.check-trigger.outputs.load_profile }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse and display key metrics if results file exists
          if [ -f "/tmp/k6-results/${{ matrix.test_suite }}.json" ]; then
            echo "### Performance Metrics" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            tail -n 1 "/tmp/k6-results/${{ matrix.test_suite }}.json" | jq '.metrics | {
              http_reqs: .http_reqs.values.count,
              http_req_duration_avg: .http_req_duration.values.avg,
              http_req_duration_p95: .http_req_duration.values["p(95)"],
              http_req_failed_rate: .http_req_failed.values.rate,
              vus_max: .vus_max.values.max
            }' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Results file not found" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload k6 results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: k6-results-${{ matrix.test_suite }}-${{ needs.check-trigger.outputs.environment }}
          path: /tmp/k6-results/${{ matrix.test_suite }}.json
          retention-days: ${{ env.PERFORMANCE_RESULTS_RETENTION_DAYS }}

  # Lighthouse CI Testing
  lighthouse-ci:
    name: Lighthouse CI Tests
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && github.event.inputs.run_lighthouse == 'true' || github.event_name != 'workflow_dispatch')
    
    strategy:
      matrix:
        device: [desktop, mobile]
    
    defaults:
      run:
        working-directory: ./socialmapper-ui
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: socialmapper-ui/package-lock.json
      
      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
      
      - name: Build application
        run: |
          npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ needs.check-trigger.outputs.environment == 'production' && 'https://api.socialmapper.com' || 'https://staging-api.socialmapper.com' }}
          VITE_APP_TITLE: 'SocialMapper Demo'
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || 'pk.test' }}
      
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      
      - name: Create Lighthouse results directory
        run: |
          mkdir -p ../performance/results/lighthouse/${{ matrix.device }}
      
      - name: Run Lighthouse CI - ${{ matrix.device }}
        env:
          LHCI_BUILD_CONTEXT__EXTERNAL_BUILD_URL: ../performance/results/lighthouse/${{ matrix.device }}
        run: |
          CONFIG_FILE="../performance/lighthouse/lighthouserc.json"
          if [ "${{ matrix.device }}" = "mobile" ]; then
            CONFIG_FILE="../performance/lighthouse/mobile-config.json"
          fi
          
          echo "Running Lighthouse CI for ${{ matrix.device }} configuration"
          lhci autorun --config="$CONFIG_FILE" || true
      
      - name: Process Lighthouse results
        if: always()
        run: |
          echo "## Lighthouse CI Results - ${{ matrix.device }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.check-trigger.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Device:** ${{ matrix.device }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Look for Lighthouse results
          if [ -d "../performance/results/lighthouse/${{ matrix.device }}" ]; then
            echo "### Performance Summary" >> $GITHUB_STEP_SUMMARY
            echo "Lighthouse results generated successfully" >> $GITHUB_STEP_SUMMARY
            
            # Try to find and summarize results
            if ls ../performance/results/lighthouse/${{ matrix.device }}/*.json >/dev/null 2>&1; then
              echo "Results files found in artifacts" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Lighthouse results directory not found" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lighthouse-results-${{ matrix.device }}-${{ needs.check-trigger.outputs.environment }}
          path: performance/results/lighthouse/${{ matrix.device }}
          retention-days: ${{ env.PERFORMANCE_RESULTS_RETENTION_DAYS }}

  # Performance Analysis and Reporting
  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: [check-trigger, k6-load-tests, lighthouse-ci]
    if: always() && needs.check-trigger.outputs.should_run == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./performance-results
      
      - name: Analyze performance results
        run: |
          echo "# Performance Test Analysis Report" > performance-report.md
          echo "" >> performance-report.md
          echo "**Environment:** ${{ needs.check-trigger.outputs.environment }}" >> performance-report.md
          echo "**Load Profile:** ${{ needs.check-trigger.outputs.load_profile }}" >> performance-report.md
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> performance-report.md
          echo "**Commit:** ${{ github.sha }}" >> performance-report.md
          echo "" >> performance-report.md
          
          # Analyze k6 results
          echo "## k6 Load Test Results" >> performance-report.md
          echo "" >> performance-report.md
          
          if ls ./performance-results/k6-results-*/*.json >/dev/null 2>&1; then
            for result_file in ./performance-results/k6-results-*/*.json; do
              test_name=$(basename "$(dirname "$result_file")" | sed 's/k6-results-//' | sed 's/-.*$//')
              echo "### $test_name" >> performance-report.md
              echo "\`\`\`json" >> performance-report.md
              if [ -f "$result_file" ]; then
                tail -n 1 "$result_file" | jq '.metrics | {
                  total_requests: .http_reqs.values.count,
                  avg_response_time: .http_req_duration.values.avg,
                  p95_response_time: .http_req_duration.values["p(95)"],
                  error_rate: .http_req_failed.values.rate,
                  max_vus: .vus_max.values.max
                }' 2>/dev/null || echo "Unable to parse results"
              else
                echo "Results file not found: $result_file"
              fi
              echo "\`\`\`" >> performance-report.md
              echo "" >> performance-report.md
            done
          else
            echo "No k6 results found" >> performance-report.md
            echo "" >> performance-report.md
          fi
          
          # Analyze Lighthouse results
          echo "## Lighthouse CI Results" >> performance-report.md
          echo "" >> performance-report.md
          
          if ls ./performance-results/lighthouse-results-*/ >/dev/null 2>&1; then
            for device_dir in ./performance-results/lighthouse-results-*/; do
              device_name=$(basename "$device_dir" | sed 's/lighthouse-results-//' | sed 's/-.*$//')
              echo "### $device_name Performance" >> performance-report.md
              echo "Lighthouse results available in artifacts" >> performance-report.md
              echo "" >> performance-report.md
            done
          else
            echo "No Lighthouse results found" >> performance-report.md
            echo "" >> performance-report.md
          fi
          
          echo "## Summary" >> performance-report.md
          echo "" >> performance-report.md
          echo "- **k6 Tests Status:** ${{ needs.k6-load-tests.result }}" >> performance-report.md
          echo "- **Lighthouse Tests Status:** ${{ needs.lighthouse-ci.result }}" >> performance-report.md
          echo "" >> performance-report.md
          echo "Detailed results are available in the uploaded artifacts." >> performance-report.md
      
      - name: Comment PR with results (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
      
      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report-${{ needs.check-trigger.outputs.environment }}
          path: performance-report.md
          retention-days: ${{ env.PERFORMANCE_RESULTS_RETENTION_DAYS }}
      
      - name: Add job summary
        run: |
          cat performance-report.md >> $GITHUB_STEP_SUMMARY

  # Performance Regression Check
  regression-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: [check-trigger, performance-analysis]
    if: always() && needs.check-trigger.outputs.should_run == 'true' && needs.check-trigger.outputs.environment == 'production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download current results
        uses: actions/download-artifact@v3
        with:
          path: ./current-results
      
      - name: Check for performance regressions
        run: |
          echo "# Performance Regression Analysis" >> regression-report.md
          echo "" >> regression-report.md
          echo "**Environment:** production" >> regression-report.md
          echo "**Baseline:** Previous successful run" >> regression-report.md
          echo "**Current:** ${{ github.sha }}" >> regression-report.md
          echo "" >> regression-report.md
          
          # This is a simplified regression check
          # In a real implementation, you would compare against historical data
          echo "## Regression Check Status" >> regression-report.md
          echo "" >> regression-report.md
          
          if [ "${{ needs.k6-load-tests.result }}" = "success" ] && [ "${{ needs.lighthouse-ci.result }}" = "success" ]; then
            echo "✅ **PASS** - No significant performance regressions detected" >> regression-report.md
            echo "regression_status=PASS" >> $GITHUB_ENV
          else
            echo "❌ **FAIL** - Performance tests failed or detected regressions" >> regression-report.md
            echo "regression_status=FAIL" >> $GITHUB_ENV
          fi
          
          echo "" >> regression-report.md
          echo "For detailed analysis, review the individual test results." >> regression-report.md
      
      - name: Fail workflow on regression
        if: env.regression_status == 'FAIL'
        run: |
          echo "Performance regression detected!"
          exit 1
      
      - name: Upload regression report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: regression-report-${{ needs.check-trigger.outputs.environment }}
          path: regression-report.md
          retention-days: ${{ env.PERFORMANCE_RESULTS_RETENTION_DAYS }}

  # Notification
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [check-trigger, k6-load-tests, lighthouse-ci, performance-analysis, regression-check]
    if: always() && needs.check-trigger.outputs.should_run == 'true'
    
    steps:
      - name: Notify Slack on Success
        if: needs.k6-load-tests.result == 'success' && needs.lighthouse-ci.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#performance-alerts'
          text: |
            ✅ Performance tests completed successfully!
            Environment: ${{ needs.check-trigger.outputs.environment }}
            Load Profile: ${{ needs.check-trigger.outputs.load_profile }}
            Commit: ${{ github.sha }}
            
            Check the workflow artifacts for detailed results.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Notify Slack on Failure
        if: needs.k6-load-tests.result == 'failure' || needs.lighthouse-ci.result == 'failure' || needs.regression-check.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#performance-alerts'
          text: |
            ❌ Performance tests failed!
            Environment: ${{ needs.check-trigger.outputs.environment }}
            Load Profile: ${{ needs.check-trigger.outputs.load_profile }}
            Commit: ${{ github.sha }}
            
            k6 Tests: ${{ needs.k6-load-tests.result }}
            Lighthouse: ${{ needs.lighthouse-ci.result }}
            Regression Check: ${{ needs.regression-check.result }}
            
            Please review the workflow logs and take action.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}