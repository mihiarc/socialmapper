# Mock Services for CI/CD Pipeline Testing
# This Docker Compose file creates mock versions of external services
# needed for testing without requiring real cloud services

version: '3.8'

services:
  # Mock Redis for caching and job queue
  mock-redis:
    image: redis:7-alpine
    container_name: socialmapper-mock-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock PostgreSQL database
  mock-postgres:
    image: postgres:15-alpine
    container_name: socialmapper-mock-postgres
    environment:
      POSTGRES_DB: socialmapper_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./mock-db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d socialmapper_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock API Server for testing
  mock-api:
    build:
      context: ../../../socialmapper-api
      dockerfile: Dockerfile.dev
    container_name: socialmapper-mock-api
    environment:
      - DATABASE_URL=postgresql://testuser:testpass@mock-postgres:5432/socialmapper_test
      - REDIS_URL=redis://mock-redis:6379/0
      - CENSUS_API_KEY=mock_census_key
      - FLASK_ENV=testing
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    depends_on:
      mock-postgres:
        condition: service_healthy
      mock-redis:
        condition: service_healthy
    volumes:
      - ../../../socialmapper-api:/app
    command: ["python", "-m", "uvicorn", "api_server.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Frontend for testing
  mock-frontend:
    build:
      context: ../../../socialmapper-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_MAPBOX_TOKEN=pk.test.mock.token
    container_name: socialmapper-mock-frontend
    ports:
      - "3000:80"
    depends_on:
      - mock-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Prometheus for monitoring
  mock-prometheus:
    image: prom/prometheus:latest
    container_name: socialmapper-mock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-mock.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Grafana for dashboards
  mock-grafana:
    image: grafana/grafana:latest
    container_name: socialmapper-mock-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    depends_on:
      - mock-prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Alertmanager
  mock-alertmanager:
    image: prom/alertmanager:latest
    container_name: socialmapper-mock-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager-mock.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock External API Service (simulates Census API, etc.)
  mock-external-api:
    image: wiremock/wiremock:latest
    container_name: socialmapper-mock-external-api
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock-mappings:/home/wiremock/mappings
      - ./wiremock-files:/home/wiremock/__files
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/__admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock S3 Service (MinIO)
  mock-s3:
    image: minio/minio:latest
    container_name: socialmapper-mock-s3
    environment:
      MINIO_ACCESS_KEY: mock-access-key
      MINIO_SECRET_KEY: mock-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Container Registry
  mock-registry:
    image: registry:2
    container_name: socialmapper-mock-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock SMTP Server for notifications
  mock-smtp:
    image: mailhog/mailhog:latest
    container_name: socialmapper-mock-smtp
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Load Testing with k6
  mock-k6:
    image: grafana/k6:latest
    container_name: socialmapper-mock-k6
    volumes:
      - ../../../performance/k6:/scripts
    environment:
      - K6_OUT=json=/tmp/results.json
    depends_on:
      mock-api:
        condition: service_healthy
    profiles:
      - load-test

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  minio-data:
  registry-data:

networks:
  default:
    name: socialmapper-mock-network