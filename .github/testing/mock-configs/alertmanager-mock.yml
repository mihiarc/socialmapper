# Mock Alertmanager Configuration for Testing
# This configuration provides alert routing and notification testing
# without requiring real notification channels

global:
  # Mock SMTP configuration
  smtp_smarthost: 'mock-smtp:1025'
  smtp_from: 'alerts@test.socialmapper.com'
  smtp_hello: 'alertmanager.test.socialmapper.com'

# Template for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Alert routing configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    # Critical alerts route to immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 15m

    # Performance alerts
    - match:
        category: performance
      receiver: 'performance-team'
      group_interval: 5m
      repeat_interval: 30m

    # Security alerts
    - match:
        category: security
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 10m

    # Infrastructure alerts
    - match:
        category: infrastructure
      receiver: 'infrastructure-team'

    # Default route for all other alerts
    - receiver: 'default-notifications'

# Alert receivers (notification channels)
receivers:
  # Default webhook receiver for testing
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:8025/webhook/test'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'test'
            password: 'test'

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'critical@test.socialmapper.com'
        subject: '🚨 CRITICAL Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://mock-external-api:8080/webhooks/critical'
        send_resolved: true

  # Performance team notifications
  - name: 'performance-team'
    email_configs:
      - to: 'performance@test.socialmapper.com'
        subject: '⚡ Performance Alert: {{ .GroupLabels.alertname }}'
        body: |
          Performance issue detected:
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          - Current value: {{ .Annotations.value }}
          - Threshold: {{ .Annotations.threshold }}
          {{ end }}

  # Security team notifications
  - name: 'security-team'
    email_configs:
      - to: 'security@test.socialmapper.com'
        subject: '🛡️ Security Alert: {{ .GroupLabels.alertname }}'
        body: |
          Security alert triggered:
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          - Severity: {{ .Labels.severity }}
          - Source: {{ .Labels.instance }}
          {{ end }}

  # Infrastructure team notifications
  - name: 'infrastructure-team'
    email_configs:
      - to: 'infra@test.socialmapper.com'
        subject: '🏗️ Infrastructure Alert: {{ .GroupLabels.alertname }}'
        body: |
          Infrastructure issue detected:
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          - Component: {{ .Labels.component }}
          - Instance: {{ .Labels.instance }}
          {{ end }}

  # Default notifications for non-critical alerts
  - name: 'default-notifications'
    email_configs:
      - to: 'alerts@test.socialmapper.com'
        subject: '📊 Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ .CommonAnnotations.summary }}
          
          Affected services:
          {{ range .Alerts }}
          - {{ .Labels.service }} ({{ .Labels.instance }})
          {{ end }}

# Inhibit rules to prevent alert spam
inhibit_rules:
  # Inhibit warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit node alerts when the entire cluster is down
  - source_match:
      alertname: 'ClusterDown'
    target_match_re:
      alertname: 'Node.*'

  # Inhibit service alerts when the node is down
  - source_match:
      alertname: 'NodeDown'
    target_match:
      node: '{{ .Labels.node }}'

# Mock notification limits for testing
global:
  resolve_timeout: 5m
  http_config:
    follow_redirects: true
  smtp_require_tls: false

# Test data injection (for testing purposes)
# This would not be present in production