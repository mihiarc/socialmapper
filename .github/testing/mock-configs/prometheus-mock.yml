# Mock Prometheus Configuration for Testing
# This configuration provides a minimal Prometheus setup for testing
# CI/CD pipeline monitoring without requiring full infrastructure

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mock-cluster'
    environment: 'test'

rule_files:
  - "performance_rules.yml"
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - mock-alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Mock API application metrics
  - job_name: 'socialmapper-api'
    static_configs:
      - targets: ['mock-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      format: ['prometheus']

  # Mock Frontend metrics (if available)
  - job_name: 'socialmapper-frontend'
    static_configs:
      - targets: ['mock-frontend:80']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['mock-redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL metrics (would need postgres_exporter in real setup)
  - job_name: 'postgres'
    static_configs:
      - targets: ['mock-postgres:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Mock external services health checks
  - job_name: 'external-services'
    static_configs:
      - targets: 
        - 'mock-external-api:8080'
        - 'mock-s3:9000'
        - 'mock-registry:5000'
    metrics_path: '/health'
    scrape_interval: 60s

  # Node exporter (system metrics) - mock
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s

# Sample recording rules for testing
rule_files:
  - "recording_rules.yml"

# Sample data for testing
# In a real setup, these would be collected from actual services