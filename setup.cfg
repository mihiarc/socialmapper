[mutmut]
# Mutation testing configuration for SocialMapper

# Paths to mutate (relative to project root)
paths_to_mutate = socialmapper/

# Test runner command
runner = pytest tests/ -x --tb=short

# Directory containing tests
tests_dir = tests/

# Exclude certain files from mutation testing
exclude_files = 
    socialmapper/__init__.py
    socialmapper/ui/streamlit/
    socialmapper/visualization/examples.py
    socialmapper/tutorial_helper.py

# Exclude specific patterns
exclude_patterns =
    **/test_*.py
    **/conftest.py
    **/__pycache__/**
    **/migrations/**

# Cache directory for mutation results
cache_only = false

# Backup original files
backup = true

# Show progress
show_times = true

# Use multiprocessing (set to number of CPU cores)
processes = auto