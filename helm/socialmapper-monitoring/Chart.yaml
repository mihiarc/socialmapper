apiVersion: v2
name: socialmapper-monitoring
description: Comprehensive monitoring stack for SocialMapper with Prometheus, Grafana, and AlertManager
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - monitoring
  - prometheus
  - grafana
  - alertmanager
  - observability

home: https://github.com/your-org/socialmapper
sources:
  - https://github.com/your-org/socialmapper

maintainers:
  - name: SocialMapper Team
    email: team@socialmapper.com

dependencies:
  - name: kube-prometheus-stack
    version: "55.5.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "7.0.19"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled

annotations:
  category: Monitoring
  licenses: Apache-2.0