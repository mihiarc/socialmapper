{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "socialmapper-monitoring.fullname" . }}-prometheus
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "socialmapper-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ .Values.prometheus.server.replicas }}
  selector:
    matchLabels:
      {{- include "socialmapper-monitoring.prometheus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "socialmapper-monitoring.prometheus.selectorLabels" . | nindent 8 }}
        {{- include "socialmapper-monitoring.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        checksum/config: {{ include (print $.Template.BasePath "/prometheus/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "socialmapper-monitoring.prometheus.serviceAccountName" . }}
      {{- include "socialmapper-monitoring.podSecurityContext" . | nindent 6 }}
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.server.image.repository }}:{{ .Values.prometheus.server.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.server.image.pullPolicy }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus/'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time={{ .Values.prometheus.server.storage.retention }}'
            - '--web.enable-lifecycle'
            - '--web.enable-admin-api'
            - '--web.external-url=https://prometheus.{{ .Values.global.domain }}'
            - '--web.route-prefix=/'
            - '--log.level=info'
          ports:
            - name: web
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.prometheus.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "socialmapper-monitoring.env" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules/
              readOnly: true
            - name: storage
              mountPath: /prometheus/
          {{- include "socialmapper-monitoring.securityContext" . | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "socialmapper-monitoring.fullname" . }}-prometheus-config
        - name: rules
          configMap:
            name: {{ include "socialmapper-monitoring.fullname" . }}-prometheus-rules
        - name: storage
          {{- if .Values.prometheus.server.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "socialmapper-monitoring.fullname" . }}-prometheus-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- include "socialmapper-monitoring.nodeSelector" . | nindent 6 }}
      {{- with .Values.prometheus.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prometheus.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}